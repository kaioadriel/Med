        const App = () => {
            // --- CONSTANTES ---
            

            // --- ESTADOS ---

                        const syncData = (updatedMeds) => {
                setMedications(updatedMeds);

            const updateActiveMedication = (updates) => {
                const updatedMeds = medications.map(m => m.id === activeMedicationId ? { ...m, ...updates } : m);

            };

            const keyboardTimeoutRef = useRef(null);
            const fileInputRef = useRef(null);

            const toastTimeout = useRef(null);

            // --- DATAS, BUSCAS E CÁLCULOS ---
                        const getTodayDateStr = () => {
                const now = new Date();
                const spDate = new Intl.DateTimeFormat('pt-BR', {
                    timeZone: 'America/Sao_Paulo',
                    year: 'numeric',
                    month: '2-digit',
                    day: '2-digit'
                }).format(now);
                const [day, month, year] = spDate.split('/');
                return `${year}-${month}-${day}`;
            };

            const isValidDateStr = (dateStr) => {
                if (!/^\d{4}-\d{2}-\d{2}$/.test(dateStr || '')) return false;
                const [year, month, day] = dateStr.split('-').map(Number);
                const date = new Date(dateStr + 'T12:00:00');
                return !Number.isNaN(date.getTime()) &&
                    date.getFullYear() === year &&
                    date.getMonth() + 1 === month &&
                    date.getDate() === day;
            };

            const formatDateShortYear = (dateStr) => {
                if (!isValidDateStr(dateStr)) return '--/--/--';
                const [year, month, day] = dateStr.split('-');
                return `${day}/${month}/${year.slice(-2)}`;
            };

            const formatDateSearchTerms = (dateStr) => {
                if (!isValidDateStr(dateStr)) return '';
                const [year, month, day] = dateStr.split('-');
                const shortYear = year.slice(-2);
                return `${dateStr} ${day}/${month}/${year} ${day}/${month}/${shortYear} ${day}-${month}-${year} ${day}-${month}-${shortYear} ${day}${month}${year} ${day}${month}${shortYear} ${day} ${month} ${year} ${shortYear}`;
            };

            const normalizeSearchText = (value) => String(value || '').trim().toLowerCase();

            const sanitizePositiveNumber = (value) => {
                if (value === '') return '';
                const number = Number(value);
                if (!Number.isFinite(number) || number < 0) return '';
                return number;
            };

            const normalizeDatePeriod = (period) => {
                const start = isValidDateStr(period?.start) ? period.start : '';
                const end = isValidDateStr(period?.end) ? period.end : '';
                if (start && end && start > end) return { start: end, end: start };
                return { start, end };
            };

            const isDateInsidePeriod = (dateStr, period) => {
                if (!isValidDateStr(dateStr)) return false;
                const { start, end } = normalizeDatePeriod(period);
                if (start && dateStr < start) return false;
                if (end && dateStr > end) return false;
                return true;
            };

            const hasActivePeriod = (period) => {
                const { start, end } = normalizeDatePeriod(period);
                return Boolean(start || end);
            };

            const calendarDays = useMemo(() => {
                const days = [];
                for (let i = -3; i <= 60; i++) {
                    const d = new Date(); d.setDate(d.getDate() + i);
                    const dateStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    days.push({ 
                        dateStr, 
                        label: formatDateShortYear(dateStr), 
                        weekday: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0,3), 
                        isToday: i === 0, 
                        isPast: i < 0 
                    });
                }
                return days;
            }, []);

            const getLogsValue = (dateStr) => {
                if (dateStr > getTodayDateStr()) return 0;
                const log = logs[dateStr];
                return log ? (Number(log.d1) || 0) + (Number(log.d2) || 0) + (Number(log.d3) || 0) : 0;
            };

            const statsCalculated = useMemo(() => {
                const allEntries = Object.values(logs);
                const totalSaidaGeral = allEntries.reduce((acc, curr) => acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0), 0);
                const todayStr = getTodayDateStr();
                const totalSaidaAteHoje = allEntries.reduce((acc, curr) => curr.data <= todayStr ? acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0) : acc, 0);
                const totalEntrada = replenishments.reduce((acc, curr) => acc + (curr.isScheduled ? 0 : (Number(curr.amount) || 0)), 0);
                return { previsao: (activeMedication?.estoqueInicial || 0) + totalEntrada - totalSaidaGeral, estoque: (activeMedication?.estoqueInicial || 0) + totalEntrada - totalSaidaAteHoje, totalEntrada };
            }, [logs, replenishments, (activeMedication?.estoqueInicial || 0)]);

            const advancedStats = useMemo(() => {
                const todayStr = getTodayDateStr();
                const getTotal = (log) => (Number(log?.d1)||0) + (Number(log?.d2)||0) + (Number(log?.d3)||0);
                const allLogs = Object.entries(logs)
                    .map(([dateStr, log]) => ({ data: log.data || dateStr, total: getTotal(log) }))
                    .filter(item => item.total > 0 && isValidDateStr(item.data));

                const pastLogs = allLogs.filter(item => item.data <= todayStr).sort((a, b) => a.data.localeCompare(b.data));
                const futureLogs = allLogs.filter(item => item.data > todayStr).sort((a, b) => a.data.localeCompare(b.data));

                const averageDaily = (items) => {
                    const total = items.reduce((acc, item) => acc + item.total, 0);
                    return items.length ? total / items.length : 0;
                };

                const mediaDiaria = averageDaily(pastLogs);
                const mediaDiariaFutura = averageDaily(futureLogs);
                const mediaSemanal = mediaDiaria * 7;
                const mediaSemanalFutura = mediaDiariaFutura * 7;
                const mediaMensal = mediaDiaria * 30;
                const mediaMensalFutura = mediaDiariaFutura * 30;

                const pastTotals = pastLogs.map(item => item.total);
                const tendencia = pastTotals.length >= 14
                    ? (
                        pastTotals.slice(-7).reduce((a,b)=>a+b,0) >
                        pastTotals.slice(-14,-7).reduce((a,b)=>a+b,0)
                    )
                    : false;

                const registrosComDose = [...allLogs].sort((a, b) => b.data.localeCompare(a.data));

                const terminoData = registrosComDose.length
                    ? formatDateShortYear(registrosComDose[0].data)
                    : null;

                let fimEstoqueData = null;
                let estoqueProjetado = statsCalculated.estoque;

                if (estoqueProjetado <= 0) {
                    fimEstoqueData = formatDateShortYear(todayStr);
                } else {
                    const diasFuturos = calendarDays
                        .filter(day => day.dateStr > todayStr)
                        .sort((a, b) => a.dateStr.localeCompare(b.dateStr));

                    for (const day of diasFuturos) {
                        const log = logs[day.dateStr];
                        const totalDoDia = getTotal(log);

                        estoqueProjetado -= totalDoDia;

                        if (estoqueProjetado <= 0) {
                            fimEstoqueData = formatDateShortYear(day.dateStr);
                            break;
                        }
                    }
                }

                const hoje = new Date(todayStr + 'T12:00:00');

                const mesAtual = hoje.getMonth();
                const anoAtual = hoje.getFullYear();

                let consumoMesAtual = 0;
                let consumoMesAnterior = 0;

                allLogs.forEach(item => {
                    const data = new Date(item.data + 'T12:00:00');

                    if (
                        data.getMonth() === mesAtual &&
                        data.getFullYear() === anoAtual
                    ) {
                        consumoMesAtual += item.total;
                    }

                    const mesAnterior = mesAtual === 0 ? 11 : mesAtual - 1;
                    const anoAnterior = mesAtual === 0 ? anoAtual - 1 : anoAtual;

                    if (
                        data.getMonth() === mesAnterior &&
                        data.getFullYear() === anoAnterior
                    ) {
                        consumoMesAnterior += item.total;
                    }
                });

                return {
                    mediaDiaria,
                    mediaDiariaFutura,
                    mediaSemanal,
                    mediaSemanalFutura,
                    mediaMensal,
                    mediaMensalFutura,
                    tendencia,
                    fimEstoque: fimEstoqueData,
                    termino: terminoData,
                    consumoMesAtual,
                    consumoMesAnterior
                };

            }, [logs, statsCalculated, calendarDays]);

            const chartDataCalculated = useMemo(() => {
                let data = []; let totalGeral = 0;
                const today = new Date(); today.setHours(0,0,0,0);
                const formatD = (d) => { const offset = d.getTimezoneOffset() * 60000; return new Date(d.getTime() - offset).toISOString().split('T')[0]; };

                if (chartType === 'weekly') {
                    let sumAnt = 0; for (let i = 13; i >= 7; i--) { let d = new Date(today); d.setDate(d.getDate() - i); sumAnt += getLogsValue(formatD(d)); }
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); 
                    for (let i = 6; i >= 0; i--) { let d = new Date(today); d.setDate(d.getDate() - i); let val = getLogsValue(formatD(d)); data.push({ name: d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0,3), Total: val }); totalGeral += val; }
                } else if (chartType === 'monthly') {
                    let sumAnt = 0; for(let i = 28; i < 56; i++) { let d = new Date(today); d.setDate(d.getDate() - i); sumAnt += getLogsValue(formatD(d)); }
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); 
                    for(let w = 3; w >= 0; w--) { let sumW = 0; for(let dIdx = 0; dIdx < 7; dIdx++) { let d = new Date(today); d.setDate(d.getDate() - ((w * 7) + dIdx)); sumW += getLogsValue(formatD(d)); } data.push({ name: `Sem ${4 - w}`, Total: sumW }); totalGeral += sumW; }
                } else if (chartType === 'yearly') {
                    let cYear = today.getFullYear(); let cMonth = today.getMonth(); let monthsData = [];
                    for(let i = 11; i >= 0; i--) { let d = new Date(cYear, cMonth - i, 1); let mStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; let sumM = 0; Object.keys(logs).forEach(date => { if (date.startsWith(mStr)) sumM += getLogsValue(date); }); monthsData.push({ name: d.toLocaleDateString('pt-BR', { month: 'short' }).slice(0,3), Total: sumM, sortKey: mStr }); totalGeral += sumM; }
                    let oldestM = monthsData[0].sortKey; let sumAnt = 0; Object.keys(logs).forEach(date => { if (date.slice(0, 7) < oldestM) sumAnt += getLogsValue(date); });
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); data = [...data, ...monthsData];
                }
                return { data, total: totalGeral };
            }, [logs, chartType]);

            const historyItemsCalculated = useMemo(() => {
                const todayStr = getTodayDateStr();
                const pastLogs = Object.values(logs).filter(l => l.data < todayStr && ((Number(l.d1)||0) + (Number(l.d2)||0) + (Number(l.d3)||0)) > 0);
                if (pastLogs.length === 0) return [];
                const oldestDateStr = pastLogs.reduce((oldest, curr) => curr.data < oldest.data ? curr : oldest).data;
                const items = []; let emptyStreak = []; let currDate = new Date(todayStr + 'T12:00:00'); currDate.setDate(currDate.getDate() - 1);
                const oldestDateObj = new Date(oldestDateStr + 'T12:00:00'); let logCount = 0;
                while (currDate >= oldestDateObj) {

                    if (total > 0) {

                        emptyStreak = []; items.push({ type: 'log', log, isEditable: logCount < 5 }); logCount++;

                if (emptyStreak.length > 5) { items.push({ type: 'empty_group', startDate: emptyStreak[emptyStreak.length - 1].data, endDate: emptyStreak[0].data, count: emptyStreak.length }); } else if (emptyStreak.length > 0) { emptyStreak.forEach(emptyLog => items.push({ type: 'log', log: emptyLog, isEditable: logCount < 5 })); }
                return items;

            const handleInsertRow = (targetDate) => {
                const idx = calendarDays.findIndex(d => d.dateStr === targetDate); 
                if (idx === -1) return;

                const nextDate = calendarDays[idx + 1]?.dateStr;
                if (!nextDate) {
                    showToast("Não há próxima linha disponível para inserir.", "error");
                    return;
                }

                const newLogs = { ...logs };

                // Insere a nova linha abaixo do card atual: preserva o card clicado,
                // empurra os registros seguintes para baixo e deixa a nova linha zerada.
                for (let i = calendarDays.length - 1; i > idx + 1; i--) {
                    const prev = calendarDays[i - 1].dateStr;
                    const curr = calendarDays[i].dateStr;

                    if (newLogs[prev]) {
                        newLogs[curr] = { ...newLogs[prev], data: curr };
                    } else {
                        delete newLogs[curr];
                    }
                }

                newLogs[nextDate] = { d1: '', d2: '', d3: '', data: nextDate };
                updateActiveMedication({ logs: newLogs }); 
                showToast("Linha zerada inserida abaixo!");
            };

                    if (newLogs[next]) newLogs[curr] = { ...newLogs[next], data: curr };

                setIsKeyboardVisible(false); 
                setForceShowNav(false);
            };

            const handleKeyDown = (e, dayIdx, doseNum) => {
                const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                if (!keys.includes(e.key)) return;

                let nextDayIdx = dayIdx;
                let nextDoseNum = doseNum;

                if (e.key === 'ArrowRight') {
                    if (doseNum < 3) {
                        nextDoseNum++;
                    } else if (dayIdx < calendarDays.length - 1) {
                        nextDayIdx++;
                        nextDoseNum = 1;
                    }
                } else if (e.key === 'ArrowLeft') {
                    if (doseNum > 1) {
                        nextDoseNum--;
                    } else if (dayIdx > 0) {
                        nextDayIdx--;
                        nextDoseNum = 3;
                    }

                                        <div key={item.startDate} className="p-4 rounded-2xl border bg-slate-50/60 text-slate-400 text-[9px] font-black uppercase text-center my-2">Vazio: {item.count} dias</div>
                                    ) : (
                                        <div key={item.log.data} className="flex items-center gap-2 p-2 rounded-2xl border bg-white/90 shadow-sm">
                                            <div className="h-11 w-20 rounded-2xl flex items-center justify-center bg-slate-200 text-slate-600 border shrink-0"><span className="text-[13px] font-black leading-none whitespace-nowrap">{formatDateShortYear(item.log.data)}</span></div>
                                            <div className="flex-1 flex justify-center gap-1.5">{[1,2,3].map(num => (<input key={num} type="number" min="0" step="1" placeholder="-" disabled={!item.isEditable} className={`w-full max-w-[40px] h-10 text-center rounded-xl font-black border ${item.isEditable ? 'bg-white border-slate-200 focus:border-teal-400' : 'bg-slate-100 text-slate-300'}`} value={item.log[`d${num}`]} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>handleInputChange(item.log.data, `d${num}`, e.target.value)} />))}</div>
                                            <div className="w-8 flex justify-center"><span className="flex items-center justify-center h-8 w-8 text-[13px] font-black rounded-xl bg-slate-500 text-white">{(Number(item.log.d1)||0)+(Number(item.log.d2)||0)+(Number(item.log.d3)||0)}</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'purchases' && (
                            <div className="space-y-4 pt-4 animate-fade">
                                <div className="flex justify-between items-center px-2 mb-2">
                                    <h2 className="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mt-1">Compras e Agendamentos</h2>
                                    <button onClick={() => { setSupplyData({ id: null, amount: '', date: getTodayDateStr(), isScheduled: false }); setShowSupplyModal(true); }} className="bg-teal-100 text-teal-700 px-3 py-1.5 rounded-full text-[9px] font-black flex items-center shadow-sm hover:bg-teal-200 transition"><IconPlus /><span className="ml-1 uppercase">Registrar Compra</span></button>
                                </div>
                                <div className="glass-card p-3 rounded-3xl">
                                    <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Filtrar compras por período</label>
                                    <div className="grid grid-cols-2 gap-2 mt-2">
                                        <div>
                                            <span className="block text-[8px] font-black text-slate-400 uppercase ml-1 mb-1">Início</span>
                                            <input type="date" className="w-full bg-white border border-slate-200 rounded-2xl p-3 text-sm font-bold text-slate-700 outline-none focus:border-teal-400 transition-colors" value={purchasePeriod.start} onChange={e => setPurchasePeriod(prev => ({ ...prev, start: e.target.value }))} />
                                        </div>
                                        <div>
                                            <span className="block text-[8px] font-black text-slate-400 uppercase ml-1 mb-1">Fim</span>
                                            <input type="date" className="w-full bg-white border border-slate-200 rounded-2xl p-3 text-sm font-bold text-slate-700 outline-none focus:border-teal-400 transition-colors" value={purchasePeriod.end} onChange={e => setPurchasePeriod(prev => ({ ...prev, end: e.target.value }))} />
                                        </div>
                                    </div>
                                    {hasActivePeriod(purchasePeriod) && <button onClick={() => setPurchasePeriod({ start: '', end: '' })} className="w-full mt-2 py-3 bg-rose-50 text-rose-500 rounded-2xl font-black text-[10px] uppercase">Limpar período</button>}
                                    <p className="text-[9px] text-slate-400 font-bold mt-2 ml-1">{purchaseFilteredItems.length} resultado(s)</p>
                                </div>
                                <div className="space-y-3 pb-10">
                                    {purchaseFilteredItems.length === 0 && (
                                        <div className="p-5 rounded-2xl border bg-white/80 text-slate-400 text-[10px] font-black uppercase text-center">Nenhuma compra encontrada</div>
                                    )}
                                    {purchaseFilteredItems.map(compra => {
                                        const days = calculateDaysAgo(compra.date);
                                        return (
                                        <div key={compra.id} className={`p-3 rounded-2xl shadow-sm border flex items-center justify-between ${compra.isScheduled ? 'bg-amber-50/80 border-amber-200' : 'bg-white/90 border-slate-100'}`}>
                                            <div className="flex items-center flex-1 min-w-0">
                                                <div className={`h-12 w-20 rounded-xl flex items-center justify-center mr-3 font-black border shrink-0 ${compra.isScheduled ? 'bg-amber-100 text-amber-600 border-amber-200' : 'bg-teal-50 text-teal-600 border-teal-100'}`}><span className="text-[13px] leading-none whitespace-nowrap">{formatDateShortYear(compra.date)}</span></div>
                                                <div className="flex-1 min-w-0 pr-2">
                                                    <p className={`text-lg font-black leading-none mb-1 ${compra.isScheduled ? 'text-amber-600' : 'text-teal-600'}`}>{compra.amount} <span className="text-[9px] opacity-70 uppercase font-bold">Cápsulas</span></p>
                                                    <div className="mt-1.5"><span className={`text-[8px] font-black uppercase tracking-widest px-2 py-0.5 rounded-md ${compra.isScheduled ? 'bg-amber-200/60 text-amber-700' : (days === 0 ? 'bg-teal-100/60 text-teal-600' : 'bg-slate-100 text-slate-500')}`}>{compra.isScheduled ? 'Agendado' : (days === 0 ? 'Hoje' : `Há ${days} dias`)}</span></div>
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-1">
                                                {compra.isScheduled && <button onClick={() => confirmPurchase(compra.id)} className="px-4 py-2 bg-teal-500 text-white rounded-xl text-[9px] font-black uppercase shadow-sm hover:bg-teal-600 transition">Confirmar</button>}
                                                <button onClick={() => { setSupplyData({ id: compra.id, amount: compra.amount, date: compra.date, isScheduled: compra.isScheduled }); setShowSupplyModal(true); }} className="px-4 py-2 bg-slate-700 text-white rounded-xl text-[9px] font-black uppercase shadow-sm hover:bg-slate-800 transition">Editar</button>
                                                <button onClick={() => deletePurchase(compra.id)} className="px-4 py-2 bg-rose-50 text-rose-500 rounded-xl text-[9px] font-black uppercase shadow-sm hover:bg-rose-100 transition">Excluir</button>
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}
                    </main>

                                        {showMedicationModal && (
                        <div className="fixed inset-0 z-[100] flex items-center justify-center p-4 animate-fade">
                            <div className="absolute inset-0 bg-slate-900/60 backdrop-blur-sm" onClick={() => setShowMedicationModal(false)}></div>
                            <div className="glass-card w-full max-w-xs rounded-3xl p-6 relative animate-slide-up overflow-hidden">
                                {showMedicationModal === 'list' ? (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-lg font-black text-slate-800">Minhas Medicações</h3>
                                            <button onClick={() => setShowMedicationModal(false)} className="text-slate-400"><IconX /></button>
                                        </div>
                                        <div className="space-y-3 max-h-64 overflow-y-auto pr-1 scrollbar-hide">
                                            {medications.map(med => (
                                                <div key={med.id} className={`p-3 bg-white/70 rounded-2xl border ${activeMedicationId === med.id ? 'border-teal-300 shadow-sm' : 'border-slate-100'}`}>
                                                    <div className="flex items-start justify-between gap-2">
                                                        <div className="flex-1 min-w-0">
                                                            <div className="flex items-center gap-2 mb-1">
                                                                <p className="font-black text-slate-700 truncate">{med.name}</p>
                                                                {activeMedicationId === med.id && <span className="bg-teal-100 text-teal-700 text-[7px] font-black uppercase px-2 py-0.5 rounded-full">Ativo</span>}
                                                            </div>
                                                            <p className="text-[10px] text-slate-400 font-bold uppercase">Estoque inicial: {med.estoqueInicial} cáps.</p>
                                                            <p className="text-[10px] text-slate-400 font-bold uppercase">Registros: {Object.keys(med.logs || {}).length} dia(s) · Compras: {(med.replenishments || []).length}</p>
                                                        </div>
                                                    </div>
                                                    <div className="grid grid-cols-3 gap-2 mt-3">
                                                        <button onClick={() => { setActiveMedicationId(med.id); showToast('Medicação selecionada!'); }} className="py-2 bg-teal-50 text-teal-700 rounded-xl text-[8px] font-black uppercase">Selecionar</button>
                                                        <button onClick={() => { setMedicationFormData({ id: med.id, name: med.name, estoqueInicial: med.estoqueInicial }); setShowMedicationModal('form'); }} className="py-2 bg-slate-100 text-slate-600 rounded-xl text-[8px] font-black uppercase flex items-center justify-center gap-1"><IconEdit /> Editar</button>
                                                        <button onClick={() => deleteMedication(med.id)} className="py-2 bg-rose-50 text-rose-500 rounded-xl text-[8px] font-black uppercase flex items-center justify-center gap-1"><IconTrash /> Excluir</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => { setMedicationFormData({ id: null, name: '', estoqueInicial: '' }); setShowMedicationModal('form'); }} className="w-full mt-6 py-4 bg-teal-500 text-white text-[10px] font-black rounded-2xl uppercase tracking-widest shadow-lg shadow-teal-500/20 active:scale-95 transition-all">Novo Medicamento</button>
                                    </>
                                ) : (
                                    <>
                                        <div className="flex justify-between items-center mb-6">
                                            <h3 className="text-lg font-black text-slate-800">{medicationFormData.id ? 'Editar Medicação' : 'Nova Medicação'}</h3>
                                            <button onClick={() => setShowMedicationModal('list')} className="text-slate-400"><IconX /></button>
                                        </div>
                                        <p className="text-[10px] text-slate-400 font-bold leading-relaxed mb-4 bg-slate-50 border border-slate-100 rounded-2xl p-3">
                                            Edite apenas nome e estoque inicial. Os lançamentos, compras e histórico desta medicação serão preservados.
                                        </p>
                                        <div className="space-y-4">
                                            <div>
                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Nome do Medicamento</label>
                                                <input type="text" className="w-full mt-1 bg-white border border-slate-200 rounded-2xl p-4 text-sm font-bold text-slate-700 outline-none focus:border-teal-400 transition-colors" value={medicationFormData.name} onChange={e => setMedicationFormData({...medicationFormData, name: e.target.value})} placeholder="Ex: Tramal, Rivotril..." />
                                            </div>
                                            <div>
                                                <label className="text-[9px] font-black text-slate-400 uppercase tracking-widest ml-1">Estoque Inicial (Cápsulas)</label>
                                                <input type="number" className="w-full mt-1 bg-white border border-slate-200 rounded-2xl p-4 text-sm font-bold text-slate-700 outline-none focus:border-teal-400 transition-colors" value={medicationFormData.estoqueInicial} onChange={e => setMedicationFormData({...medicationFormData, estoqueInicial: e.target.value})} placeholder="Ex: 54" />
                                            </div>
                                            <div className="flex gap-2 pt-2">
                                                <button onClick={() => setShowMedicationModal('list')} className="flex-1 py-4 bg-slate-100 text-slate-500 text-[10px] font-black rounded-2xl uppercase tracking-widest active:scale-95 transition-all">Voltar</button>
                                                <button onClick={handleMedicationSave} className="flex-[2] py-4 bg-teal-500 text-white text-[10px] font-black rounded-2xl uppercase tracking-widest shadow-lg shadow-teal-500/20 active:scale-95 transition-all">Salvar</button>
                                            </div>
                                        </div>
                                    </>
                                )}
                            </div>
                        </div>
                    )}

                    {showSupplyModal && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 bg-slate-900/60 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-w-sm rounded-t-3xl sm:rounded-3xl p-8 shadow-2xl border-t-8 border-teal-500 animate-slide-up">
                                <h2 className="text-xl font-black text-center italic mb-6 uppercase text-slate-800">{supplyData.id ? (supplyData.isScheduled ? 'Ajustar Agenda' : 'Editar Compra') : (supplyData.isScheduled ? 'Novo Agendamento' : 'Novo Registro')}</h2>
                                <div className="space-y-5 mb-8">
                                    <div className={`${supplyData.isScheduled ? 'bg-amber-50/80 border-amber-200' : 'bg-teal-50/80 border-teal-100'} p-4 rounded-2xl border`}><label className={`text-[10px] font-black uppercase mb-2 block ${supplyData.isScheduled ? 'text-amber-600' : 'text-teal-600'}`}>Qtd (Cápsulas)</label><input type="number" min="0" step="1" placeholder="0" className={`w-full text-4xl font-black text-center bg-transparent border-none outline-none ${supplyData.isScheduled ? 'text-amber-600' : 'text-teal-600'}`} value={supplyData.amount} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, amount: e.target.value})} /></div>
                                    <input type="date" className={`w-full font-bold bg-slate-50 border border-slate-200 rounded-xl p-4 text-slate-700 outline-none focus:ring-2 ${supplyData.isScheduled ? 'focus:ring-amber-300' : 'focus:ring-teal-300'}`} value={supplyData.date} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, date: e.target.value})} />
                                    <button type="button" onClick={() => setSupplyData({...supplyData, isScheduled: !supplyData.isScheduled})} className={`w-full py-4 rounded-xl text-[10px] font-black uppercase tracking-widest flex items-center justify-center border transition-all active:scale-[0.99] ${supplyData.isScheduled ? 'bg-amber-100 text-amber-700 border-amber-200 shadow-sm' : 'bg-slate-100 text-slate-600 border-slate-200'}`}>
                                        <span className="mr-2"><IconClock /></span>{supplyData.isScheduled ? 'Compra agendada' : 'Agendar esta compra'}
                                    </button>
                                </div>
                                <div className="flex space-x-3"><button onClick={()=>setShowSupplyModal(false)} className="flex-1 py-4 text-xs font-black text-slate-500 bg-slate-100 rounded-xl uppercase">Voltar</button><button onClick={handleSupply} className={`flex-[2] py-4 text-white text-xs font-black rounded-xl uppercase shadow-lg ${supplyData.isScheduled ? 'bg-amber-500' : 'btn-teal'}`}>Salvar</button></div>
                            </div>
                        </div>
                    )}

                    <nav className={`glass-nav fixed bottom-0 left-0 right-0 flex justify-between items-center py-1.5 px-4 sm:px-6 pb-8 z-40 transition-transform duration-500 ${(isKeyboardVisible && !forceShowNav) ? 'translate-y-full opacity-0 pointer-events-none' : 'translate-y-0 opacity-100'}`}>
                        <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center p-2 sm:p-3 rounded-xl transition-all ${activeTab === 'dashboard' ? 'text-teal-600 scale-110 font-extrabold' : 'text-slate-400'}`}><IconHome /><span className="text-[9px] mt-1 uppercase">Início</span></button>
                        <button onClick={()=>setActiveTab('agenda')} className={`flex flex-col items-center p-2 sm:p-3 rounded-xl transition-all ${activeTab === 'agenda' ? 'text-teal-600 scale-110 font-extrabold' : 'text-slate-400'}`}><IconTable /><span className="text-[9px] mt-1 uppercase">Lançar</span></button>
                        <button onClick={()=>setActiveTab('history')} className={`flex flex-col items-center p-2 sm:p-3 rounded-xl transition-all ${activeTab === 'history' ? 'text-teal-600 scale-110 font-extrabold' : 'text-slate-400'}`}><IconHistory /><span className="text-[9px] mt-1 uppercase">Registros</span></button>
                        <button onClick={()=>setActiveTab('purchases')} className={`flex flex-col items-center p-2 sm:p-3 rounded-xl transition-all ${activeTab === 'purchases' ? 'text-teal-600 scale-110 font-extrabold' : 'text-slate-400'}`}><IconBag /><span className="text-[9px] mt-1 uppercase">Compras</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
