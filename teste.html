<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Med - Multi Medicação</title><script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f1f5f9;
    }

    .scrollbar-hide::-webkit-scrollbar {
        display: none;
    }
</style>

</head>
<body><div id="root"></div><script type="text/babel">

const { useState, useEffect, useMemo } = React;

function App() {

    // =====================================
    // ESTADOS
    // =====================================

    const [medications, setMedications] = useState(() => {

        return JSON.parse(
            localStorage.getItem('app_med_medications') || JSON.stringify([
                {
                    id: 1,
                    name: 'Medicamento Principal',
                    dosagem: '50mg',
                    observacoes: '',
                    corTema: '#0f766e',
                    estoqueInicial: 54,
                    logs: {},
                    replenishments: []
                }
            ])
        );
    });

    const [activeMedicationId, setActiveMedicationId] = useState(1);

    const [showMedicationModal, setShowMedicationModal] = useState(false);
    const [showMedicationList, setShowMedicationList] = useState(false);

    const [medicationForm, setMedicationForm] = useState({
        id: null,
        name: '',
        dosagem: '',
        observacoes: '',
        corTema: '#0f766e',
        estoqueInicial: 0
    });

    const [activeTab, setActiveTab] = useState('dashboard');

    // =====================================
    // MEDICAÇÃO ATIVA
    // =====================================

    const activeMedication = useMemo(() => {
        return medications.find(m => m.id === activeMedicationId);
    }, [medications, activeMedicationId]);

    const logs = activeMedication?.logs || {};
    const replenishments = activeMedication?.replenishments || [];

    // =====================================
    // STORAGE
    // =====================================

    useEffect(() => {

        localStorage.setItem(
            'app_med_medications',
            JSON.stringify(medications)
        );

    }, [medications]);

    // =====================================
    // FUNÇÃO CENTRAL
    // =====================================

    const updateMedicationData = (id, changes) => {

        const updated = medications.map(med => {

            if (med.id !== id) return med;

            return {
                ...med,
                ...changes
            };
        });

        setMedications(updated);
    };

    // =====================================
    // SALVAR MEDICAÇÃO
    // =====================================

    const handleSaveMedication = () => {

        if (!medicationForm.name) {
            alert('Digite o nome da medicação');
            return;
        }

        if (medicationForm.id) {

            const updated = medications.map(med => {

                if (med.id !== medicationForm.id) return med;

                return {
                    ...med,
                    name: medicationForm.name,
                    dosagem: medicationForm.dosagem,
                    observacoes: medicationForm.observacoes,
                    corTema: medicationForm.corTema,
                    estoqueInicial: Number(medicationForm.estoqueInicial)
                };
            });

            setMedications(updated);

        } else {

            const newMedication = {
                id: Date.now(),
                name: medicationForm.name,
                dosagem: medicationForm.dosagem,
                observacoes: medicationForm.observacoes,
                corTema: medicationForm.corTema,
                estoqueInicial: Number(medicationForm.estoqueInicial),
                logs: {},
                replenishments: []
            };

            setMedications([
                ...medications,
                newMedication
            ]);

            setActiveMedicationId(newMedication.id);
        }

        setMedicationForm({
            id: null,
            name: '',
            dosagem: '',
            observacoes: '',
            corTema: '#0f766e',
            estoqueInicial: 0
        });

        setShowMedicationModal(false);
    };

    // =====================================
    // EXCLUIR
    // =====================================

    const handleDeleteMedication = (id) => {

        const med = medications.find(m => m.id === id);

        const confirmDelete = window.confirm(
            `Deseja excluir ${med.name}?`
        );

        if (!confirmDelete) return;

        const updated = medications.filter(m => m.id !== id);

        setMedications(updated);

        if (updated.length > 0) {
            setActiveMedicationId(updated[0].id);
        }
    };

    // =====================================
    // REGISTRAR DOSE
    // =====================================

    const handleAddDose = () => {

        const today = new Date().toISOString().split('T')[0];

        const curr = logs[today] || {
            d1: 0,
            d2: 0,
            d3: 0,
            data: today
        };

        const updatedLogs = {
            ...logs,
            [today]: {
                ...curr,
                d1: Number(curr.d1 || 0) + 1
            }
        };

        updateMedicationData(activeMedicationId, {
            logs: updatedLogs
        });
    };

    // =====================================
    // ESTATÍSTICAS
    // =====================================

    const stats = useMemo(() => {

        const totalConsumido = Object.values(logs)
            .reduce((acc, curr) => {
                return acc +
                    (Number(curr.d1)||0) +
                    (Number(curr.d2)||0) +
                    (Number(curr.d3)||0);
            }, 0);

        const totalEntrada = replenishments
            .reduce((acc, curr) => {
                return acc + Number(curr.amount || 0);
            }, 0);

        return {
            estoque:
                activeMedication?.estoqueInicial +
                totalEntrada -
                totalConsumido,

            consumido: totalConsumido
        };

    }, [logs, replenishments, activeMedication]);

    // =====================================
    // BACKUP
    // =====================================

    const handleBackup = () => {

        const data = JSON.stringify({
            medications
        });

        const blob = new Blob([data], {
            type: 'application/json'
        });

        const a = document.createElement('a');

        a.href = URL.createObjectURL(blob);

        a.download = 'backup_multi_med.json';

        a.click();
    };

    // =====================================
    // RESTORE
    // =====================================

    const handleRestore = (e) => {

        const file = e.target.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = (event) => {

            try {

                const data = JSON.parse(event.target.result);

                if (data.medications) {

                    setMedications(data.medications);

                    setActiveMedicationId(
                        data.medications[0]?.id || 1
                    );
                }

            } catch {
                alert('Arquivo inválido');
            }
        };

        reader.readAsText(file);
    };

    return (

        <div className="max-w-md mx-auto min-h-screen bg-slate-100 pb-32">

            {/* HEADER */}

            <div className="bg-white sticky top-0 z-50 shadow-sm p-4 rounded-b-3xl">

                <div className="flex justify-between items-center">

                    <div>
                        <h1 className="text-2xl font-black text-slate-800">
                            APP MED
                        </h1>

                        <p className="text-xs font-bold text-slate-400 uppercase">
                            Sistema Multi Medicação
                        </p>
                    </div>

                    <div
                        className="text-white px-4 py-3 rounded-2xl text-center"
                        style={{
                            background: activeMedication?.corTema
                        }}
                    >
                        <div className="text-xs font-bold uppercase opacity-70">
                            Estoque
                        </div>

                        <div className="text-2xl font-black">
                            {stats.estoque}
                        </div>
                    </div>
                </div>

                {/* MEDICAÇÕES */}

                <div className="mt-4 flex gap-2 overflow-x-auto scrollbar-hide">

                    {medications.map(med => (

                        <button
                            key={med.id}
                            onClick={() => setActiveMedicationId(med.id)}
                            className="px-4 py-2 rounded-2xl text-xs font-black whitespace-nowrap text-white"
                            style={{
                                background:
                                    activeMedicationId === med.id
                                        ? med.corTema
                                        : '#94a3b8'
                            }}
                        >
                            {med.name}
                        </button>
                    ))}
                </div>

                {/* BOTÕES */}

                <div className="grid grid-cols-2 gap-2 mt-4">

                    <button
                        onClick={() => setShowMedicationModal(true)}
                        className="bg-teal-500 text-white rounded-2xl py-4 font-black text-xs"
                    >
                        + CADASTRAR
                    </button>

                    <button
                        onClick={() => setShowMedicationList(true)}
                        className="bg-slate-800 text-white rounded-2xl py-4 font-black text-xs"
                    >
                        VER MEDICAÇÕES
                    </button>
                </div>
            </div>

            {/* DASHBOARD */}

            {activeTab === 'dashboard' && (

                <div className="p-4 space-y-4">

                    <div className="bg-white rounded-3xl p-6 shadow-sm">

                        <h2 className="text-sm font-black uppercase text-slate-400 mb-4">
                            Medicamento Ativo
                        </h2>

                        <div className="flex items-center justify-between">

                            <div>
                                <div className="text-3xl font-black text-slate-800">
                                    {activeMedication?.name}
                                </div>

                                <div className="text-sm font-bold text-slate-500 mt-1">
                                    {activeMedication?.dosagem}
                                </div>
                            </div>

                            <div
                                className="w-14 h-14 rounded-2xl"
                                style={{
                                    background: activeMedication?.corTema
                                }}
                            />
                        </div>
                    </div>

                    <div className="grid grid-cols-2 gap-3">

                        <div className="bg-white rounded-3xl p-5 shadow-sm">
                            <div className="text-xs font-black uppercase text-slate-400">
                                Consumido
                            </div>

                            <div className="text-4xl font-black text-rose-500 mt-2">
                                {stats.consumido}
                            </div>
                        </div>

                        <div className="bg-white rounded-3xl p-5 shadow-sm">
                            <div className="text-xs font-black uppercase text-slate-400">
                                Estoque
                            </div>

                            <div className="text-4xl font-black text-teal-500 mt-2">
                                {stats.estoque}
                            </div>
                        </div>
                    </div>

                    <button
                        onClick={handleAddDose}
                        className="w-full py-5 rounded-3xl text-white text-sm font-black"
                        style={{
                            background: activeMedication?.corTema
                        }}
                    >
                        REGISTRAR DOSE
                    </button>

                    <div className="grid grid-cols-2 gap-3">

                        <button
                            onClick={handleBackup}
                            className="bg-white rounded-3xl py-5 font-black shadow-sm"
                        >
                            BACKUP
                        </button>

                        <label className="bg-white rounded-3xl py-5 font-black shadow-sm text-center cursor-pointer">
                            RESTAURAR

                            <input
                                type="file"
                                hidden
                                onChange={handleRestore}
                            />
                        </label>
                    </div>
                </div>
            )}

            {/* MODAL */}

            {showMedicationModal && (

                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[999]">

                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 space-y-4">

                        <h2 className="text-2xl font-black text-center">
                            {medicationForm.id
                                ? 'Editar Medicação'
                                : 'Nova Medicação'}
                        </h2>

                        <input
                            type="text"
                            placeholder="Nome"
                            value={medicationForm.name}
                            onChange={e => setMedicationForm({
                                ...medicationForm,
                                name: e.target.value
                            })}
                            className="w-full border rounded-2xl p-4"
                        />

                        <input
                            type="text"
                            placeholder="Dosagem"
                            value={medicationForm.dosagem}
                            onChange={e => setMedicationForm({
                                ...medicationForm,
                                dosagem: e.target.value
                            })}
                            className="w-full border rounded-2xl p-4"
                        />

                        <input
                            type="number"
                            placeholder="Estoque Inicial"
                            value={medicationForm.estoqueInicial}
                            onChange={e => setMedicationForm({
                                ...medicationForm,
                                estoqueInicial: e.target.value
                            })}
                            className="w-full border rounded-2xl p-4"
                        />

                        <textarea
                            placeholder="Observações"
                            value={medicationForm.observacoes}
                            onChange={e => setMedicationForm({
                                ...medicationForm,
                                observacoes: e.target.value
                            })}
                            className="w-full border rounded-2xl p-4"
                        />

                        <input
                            type="color"
                            value={medicationForm.corTema}
                            onChange={e => setMedicationForm({
                                ...medicationForm,
                                corTema: e.target.value
                            })}
                            className="w-full h-14"
                        />

                        <div className="grid grid-cols-2 gap-3">

                            <button
                                onClick={() => setShowMedicationModal(false)}
                                className="bg-slate-100 rounded-2xl py-4 font-black"
                            >
                                CANCELAR
                            </button>

                            <button
                                onClick={handleSaveMedication}
                                className="bg-teal-500 text-white rounded-2xl py-4 font-black"
                            >
                                SALVAR
                            </button>
                        </div>
                    </div>
                </div>
            )}

            {/* LISTA */}

            {showMedicationList && (

                <div className="fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-[999]">

                    <div className="bg-white rounded-3xl w-full max-w-md p-6 max-h-[80vh] overflow-y-auto">

                        <div className="flex justify-between items-center mb-5">

                            <h2 className="text-2xl font-black">
                                Medicações
                            </h2>

                            <button
                                onClick={() => setShowMedicationList(false)}
                                className="text-rose-500 font-black"
                            >
                                FECHAR
                            </button>
                        </div>

                        <div className="space-y-3">

                            {medications.map(med => (

                                <div
                                    key={med.id}
                                    className="border rounded-3xl p-4"
                                >

                                    <div className="flex justify-between items-start mb-4">

                                        <div>
                                            <div className="text-xl font-black">
                                                {med.name}
                                            </div>

                                            <div className="text-sm text-slate-500 font-bold">
                                                {med.dosagem}
                                            </div>
                                        </div>

                                        <div
                                            className="w-6 h-6 rounded-full"
                                            style={{
                                                background: med.corTema
                                            }}
                                        />
                                    </div>

                                    <div className="grid grid-cols-3 gap-2">

                                        <button
                                            onClick={() => {
                                                setActiveMedicationId(med.id);
                                                setShowMedicationList(false);
                                            }}
                                            className="bg-teal-500 text-white rounded-2xl py-3 text-xs font-black"
                                        >
                                            USAR
                                        </button>

                                        <button
                                            onClick={() => {

                                                setMedicationForm({
                                                    id: med.id,
                                                    name: med.name,
                                                    dosagem: med.dosagem,
                                                    observacoes: med.observacoes,
                                                    corTema: med.corTema,
                                                    estoqueInicial: med.estoqueInicial
                                                });

                                                setShowMedicationModal(true);
                                            }}
                                            className="bg-slate-700 text-white rounded-2xl py-3 text-xs font-black"
                                        >
                                            EDITAR
                                        </button>

                                        <button
                                            onClick={() => handleDeleteMedication(med.id)}
                                            className="bg-rose-500 text-white rounded-2xl py-3 text-xs font-black"
                                        >
                                            EXCLUIR
                                        </button>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            )}

            {/* MENU */}

            <div className="fixed bottom-0 left-0 right-0 bg-white border-t p-4 flex justify-around">

                <button
                    onClick={() => setActiveTab('dashboard')}
                    className="font-black text-sm"
                >
                    INÍCIO
                </button>
            </div>
        </div>
    );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script></body>
</html>
