        const IconAlertCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconGoogle = () => <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>;
        const IconClock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconDevice = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;
        const IconEdit = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>;

        // --- Componente de Notificação ---
        const ToastComponent = ({ toast }) => {
            if (!toast) return null;
            const isError = toast.type === 'error';
            return (
                <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[200] animate-slide-up w-full max-w-xs px-4">
                    <div className={`flex items-center p-4 rounded-2xl shadow-xl border backdrop-blur-md ${isError ? 'bg-rose-50/90 border-rose-200 text-rose-600' : 'bg-teal-50/90 border-teal-200 text-teal-700'}`}>
                        {isError ? <IconAlertCircle /> : <IconCheck />}
                        <span className="ml-3 font-semibold text-sm leading-tight">{toast.message}</span>
                    </div>
                </div>
            );
        };

        const ManualBarChart = ({ data }) => {
            if (!data || data.length === 0) return <div className="h-full flex items-center justify-center text-slate-300 text-[10px] font-bold uppercase">Sem dados</div>;
            const maxVal = Math.max(...data.map(d => d.Total), 1);
            const textClass = data.length > 8 ? "text-[8px]" : "text-[10px]";
            return (
                <div className="flex items-end justify-between h-full pt-2 pb-2 px-1 gap-1">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col items-center justify-end h-full flex-1 min-w-0">
                            <span className={`${textClass} font-extrabold text-slate-600 mb-1 whitespace-nowrap overflow-visible w-max max-w-none text-center`}>{d.Total > 0 ? d.Total : ''}</span>
                            <div className="w-full max-w-[28px] rounded-sm sm:rounded-md transition-all duration-500"
                                style={{ height: `${(d.Total / maxVal) * 100}%`, backgroundColor: d.isSpecial ? '#a78bfa' : (d.Total > 0 ? '#0d9488' : '#e2e8f0'), minHeight: d.Total > 0 ? '6px' : '3px' }}>
                            </div>
                            <span className={`${textClass} font-bold ${d.isSpecial ? 'text-violet-400' : 'text-slate-400'} mt-1 truncate w-full text-center leading-tight`}>{d.name}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            // --- ESTADOS DE AUTH E GLOBAL ---
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [isRegisterMode, setIsRegisterMode] = useState(false);
            const [authError, setAuthError] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [status, setStatus] = useState('Controle de Doses');
            const [toast, setToast] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);
            const [isKeyboardVisible, setIsKeyboardVisible] = useState(false);
            const [forceShowNav, setForceShowNav] = useState(false);

            // --- ESTADOS MULTI-MEDICAMENTOS ---
            const [medicamentos, setMedicamentos] = useState(() => JSON.parse(localStorage.getItem('med_app_medicamentos') || '[]'));
            const [activeMedId, setActiveMedId] = useState(() => localStorage.getItem('med_app_active_id') || null);
            const [showMedModal, setShowMedModal] = useState(false);
            const [showManageMeds, setShowManageMeds] = useState(false);
            const [medFormData, setMedFormData] = useState({ id: null, nome: '', estoqueInicial: 54 });

            // --- ESTADOS DE DADOS DO MED ATIVO ---
            const [logs, setLogs] = useState({});
            const [replenishments, setReplenishments] = useState([]);
            const [chartType, setChartType] = useState('weekly');
            const [showSupplyModal, setShowSupplyModal] = useState(false);
            const [supplyData, setSupplyData] = useState({ id: null, amount: '', date: '', isScheduled: false });

            const keyboardTimeoutRef = useRef(null);
            const fileInputRef = useRef(null);
            const todayRowRef = useRef(null);
            const toastTimeout = useRef(null);

            // --- HELPERS DATA ---
            const getTodayDateStr = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const calendarDays = useMemo(() => {
                const days = [];
                for (let i = -3; i <= 60; i++) {
                    const d = new Date(); d.setDate(d.getDate() + i);
                    const dateStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    days.push({ 
                        dateStr, 
                        label: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), 
                        weekday: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0,3), 
                        isToday: i === 0, 
                        isPast: i < 0 
                    });
                }
                return days;
            }, []);

            // --- LOGICA DE MEDICAMENTOS ---
            const activeMed = useMemo(() => medicamentos.find(m => m.id === activeMedId) || null, [medicamentos, activeMedId]);

            const handleSaveMed = () => {
                if (!medFormData.nome) return showToast("Digite o nome", "error");
                let updated;
                if (medFormData.id) {
                    updated = medicamentos.map(m => m.id === medFormData.id ? { ...m, nome: medFormData.nome, estoqueInicial: Number(medFormData.estoqueInicial) } : m);
                } else {
                    const newId = 'med_' + Date.now();
                    updated = [...medicamentos, { id: newId, nome: medFormData.nome, estoqueInicial: Number(medFormData.estoqueInicial), logs: {}, replenishments: [] }];
                    if (!activeMedId) setActiveMedId(newId);
                }
                setMedicamentos(updated);
                saveToCloud({ medicamentos: updated });
                setShowMedModal(false);
                setMedFormData({ id: null, nome: '', estoqueInicial: 54 });
                showToast("Medicamento salvo!");
            };

            const deleteMed = (id) => {
                if (confirm("Excluir este medicamento e todos os seus dados?")) {
                    const updated = medicamentos.filter(m => m.id !== id);
                    setMedicamentos(updated);
                    if (activeMedId === id) setActiveMedId(updated[0]?.id || null);
                    saveToCloud({ medicamentos: updated });
                }
            };

            // --- CÁLCULOS DO MED ATIVO ---
            const getLogsValue = (dateStr) => {
                if (dateStr > getTodayDateStr()) return 0;
                const log = logs[dateStr];
                return log ? (Number(log.d1) || 0) + (Number(log.d2) || 0) + (Number(log.d3) || 0) : 0;
            };

            const statsCalculated = useMemo(() => {
                if (!activeMed) return { previsao: 0, estoque: 0, totalEntrada: 0 };
                const estIni = activeMed.estoqueInicial || 0;
                const allEntries = Object.values(logs);
                const totalSaidaGeral = allEntries.reduce((acc, curr) => acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0), 0);
                const todayStr = getTodayDateStr();
                const totalSaidaAteHoje = allEntries.reduce((acc, curr) => curr.data <= todayStr ? acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0) : acc, 0);
                const totalEntrada = replenishments.reduce((acc, curr) => acc + (curr.isScheduled ? 0 : (Number(curr.amount) || 0)), 0);
                return { 
                    previsao: estIni + totalEntrada - totalSaidaGeral, 
                    estoque: estIni + totalEntrada - totalSaidaAteHoje, 
                    totalEntrada 
                };
            }, [logs, replenishments, activeMed]);

            const chartDataCalculated = useMemo(() => {
                if (!activeMed) return { data: [], total: 0 };
                let data = []; let totalGeral = 0;
                const today = new Date(); today.setHours(0,0,0,0);
                const formatD = (d) => {
