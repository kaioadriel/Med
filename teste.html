    <style>
        :root {
            --bg-deep:    #080c18;
            --bg-mid:     #0d1424;
            --bg-card:    #111827;
            --bg-card2:   #161f30;
            --accent:     #2dd4bf;
            --accent2:    #14b8a6;
            --accent-dim: rgba(45,212,191,0.12);
            --accent-glow:rgba(45,212,191,0.25);
            --amber:      #fbbf24;
            --amber-dim:  rgba(251,191,36,0.12);
            --rose:       #f43f5e;
            --rose-dim:   rgba(244,63,94,0.12);
            --violet:     #a78bfa;
            --text-1:     #f1f5f9;
            --text-2:     #94a3b8;
            --text-3:     #475569;
            --border:     rgba(255,255,255,0.07);
            --border2:    rgba(255,255,255,0.04);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none;
            background: var(--bg-deep);
            color: var(--text-1);
            min-height: 100vh;
        }

        h1, h2, h3, .font-display { font-family: 'Syne', sans-serif; }

        /* Scrollbar */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input, button { transition: all 0.2s ease; }

        /* Select */
        select { -webkit-appearance: none; appearance: none; }

        /* Animations */
        .animate-fade  { animation: fadeIn  0.35s ease-out forwards; }
        .animate-slide-up { animation: slideUp 0.35s cubic-bezier(0.16,1,0.3,1) forwards; }
        @keyframes fadeIn  { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
        @keyframes slideUp { from { opacity:0; transform:translateY(28px); } to { opacity:1; transform:translateY(0); } }
        @keyframes pulse-ring { 0%,100% { box-shadow: 0 0 0 0 rgba(244,63,94,0.5); } 50% { box-shadow: 0 0 0 6px rgba(244,63,94,0); } }

        /* Cards */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 20px;
        }
        .card-elevated {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.35);
        }

        /* Glass nav */
        .glass-nav {
            background: rgba(8,12,24,0.9);
            backdrop-filter: blur(24px);
            border-top: 1px solid var(--border);
        }

        /* Accent button */
        .btn-accent {
            background: linear-gradient(135deg, #0d9488 0%, #2dd4bf 100%);
            box-shadow: 0 4px 20px rgba(45,212,191,0.3);
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            letter-spacing: 0.04em;
            border-radius: 14px;
        }
        .btn-accent:active { transform: scale(0.97); box-shadow: 0 2px 10px rgba(45,212,191,0.2); }

        /* Ghost button */
        .btn-ghost {
            background: var(--bg-card2);
            border: 1px solid var(--border);
            color: var(--text-2);
            font-family: 'Syne', sans-serif;
            font-weight: 600;
            border-radius: 14px;
        }
        .btn-ghost:active { transform: scale(0.97); }

        /* Nav tab active */
        .nav-active { color: var(--accent) !important; }
        .nav-active .nav-dot { opacity:1; }
        .nav-dot { width:4px; height:4px; border-radius:50%; background:var(--accent); opacity:0; transition:opacity 0.2s; margin-top:2px; }

        /* Header gradient line */
        .header-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            opacity: 0.3;
        }

        /* Stock number glow */
        .stock-glow { text-shadow: 0 0 32px rgba(45,212,191,0.4); }
        .stock-glow-red { text-shadow: 0 0 32px rgba(244,63,94,0.4); }

        /* Dose input */
        .dose-input {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            color: var(--text-1);
            border-radius: 12px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            text-align: center;
            width: 100%;
            max-width: 42px;
            height: 40px;
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        .dose-input:focus { border-color: var(--accent); background: var(--bg-card2); }
        .dose-input::placeholder { color: var(--text-3); }

        /* History dose input */
        .dose-input-sm {
            background: var(--bg-deep);
            border: 1px solid var(--border);
            color: var(--text-1);
            border-radius: 10px;
            font-family: 'Syne', sans-serif;
            font-weight: 700;
            text-align: center;
            width: 100%;
            max-width: 40px;
            height: 38px;
            outline: none;
        }
        .dose-input-sm:disabled { opacity: 0.3; cursor: not-allowed; }
        .dose-input-sm:focus { border-color: var(--accent); }

        /* Row styles */
        .agenda-row        { background: var(--bg-card);  border: 1px solid var(--border2); border-radius: 16px; }
        .agenda-row-today  { background: var(--bg-card2); border: 1px solid rgba(45,212,191,0.25); border-radius: 16px; box-shadow: 0 0 0 1px rgba(45,212,191,0.1) inset; }
        .agenda-row-past   { background: rgba(8,12,24,0.5); border: 1px solid var(--border2); border-radius: 16px; opacity: 0.65; }

        /* Date badge */
        .date-badge       { background: var(--bg-card2); border: 1px solid var(--border); color: var(--text-2); border-radius: 12px; }
        .date-badge-today { background: var(--accent); border: 1px solid var(--accent); color: #080c18; }
        .date-badge-past  { background: var(--bg-deep); border: 1px solid var(--border2); color: var(--text-3); }

        /* Total badge */
        .total-badge       { background: var(--bg-card2); color: var(--text-2); border-radius: 10px; border: 1px solid var(--border); }
        .total-badge-filled { background: var(--accent-dim); color: var(--accent); border: 1px solid rgba(45,212,191,0.2); border-radius: 10px; }
        .total-badge-past  { background: var(--bg-deep); color: var(--text-3); border-radius: 10px; }
        .total-badge-red   { background: rgba(244,63,94,0.15); color: var(--rose); border: 1px solid rgba(244,63,94,0.3); border-radius: 10px; animation: pulse-ring 1.5s infinite; }

        /* Chart bars */
        .bar-fill { border-radius: 6px 6px 0 0; transition: height 0.5s cubic-bezier(0.16,1,0.3,1); }

        /* Modal */
        .modal-backdrop { background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); }
        .modal-sheet { background: var(--bg-card2); border: 1px solid var(--border); border-radius: 28px 28px 0 0; }
        @media (min-width:640px) { .modal-sheet { border-radius: 28px; } }

        /* Pill toggle */
        .pill-toggle { background: var(--bg-deep); border: 1px solid var(--border); border-radius: 999px; padding: 3px; }
        .pill-opt { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.05em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; transition: all 0.2s; color: var(--text-3); }
        .pill-opt-active { background: var(--accent); color: #080c18; }

        /* Purchase card */
        .purchase-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: 18px; }
        .purchase-card-scheduled { background: rgba(251,191,36,0.06); border: 1px solid rgba(251,191,36,0.2); border-radius: 18px; }

        /* Auth page */
        .auth-bg {
            background: var(--bg-deep);
            background-image: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(45,212,191,0.12), transparent);
        }
        .auth-input {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: var(--text-1);
            font-family: 'DM Sans', sans-serif;
            width: 100%;
            padding: 14px 16px;
            outline: none;
            text-align: center;
            transition: border-color 0.2s;
        }
        .auth-input:focus { border-color: var(--accent); }
        .auth-input::placeholder { color: rgba(255,255,255,0.2); }

        /* Loader */
        .loader-ring {
            width: 40px; height: 40px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Empty state */
        .empty-group {
            border: 1px dashed var(--border);
            border-radius: 14px;
            color: var(--text-3);
            font-family: 'Syne', sans-serif;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            text-align: center;
            padding: 14px;
        }

        /* Section label */
        .section-label {
            font-family: 'Syne', sans-serif;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            color: var(--text-3);
        }

        /* Accent line top of modal */
        .modal-accent-top {
            width: 40px; height: 4px;
            border-radius: 999px;
            background: var(--border);
            margin: 0 auto 24px;
        }
    </style>
</head>
<body>

        // --- Toast ---
        const ToastComponent = ({ toast }) => {
            if (!toast) return null;
            const isError = toast.type === 'error';
            return (
                <div className="fixed top-5 left-1/2 -translate-x-1/2 z-[200] animate-slide-up w-full max-w-xs px-4">
                    <div style={{

        // --- Bar Chart ---
        const ManualBarChart = ({ data }) => {
            const maxVal = Math.max(...data.map(d => d.Total), 1);
            const isMany = data.length > 8;
            return (
                <div style={{ display:'flex', alignItems:'flex-end', justifyContent:'space-between', height:'100%', padding:'8px 4px 4px', gap:'4px' }}>

        // === APP ===
        const App = () => {
            const estoqueInicialBase = 54;

            // States
            const [user, setUser] = useState(null);

            const [supplyData, setSupplyData] = useState({ id: null, amount: '', date: '', isScheduled: false });
            const [toast, setToast] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const keyboardTimeoutRef = useRef(null);
            const fileInputRef = useRef(null);
            const todayRowRef = useRef(null);
            const toastTimeout = useRef(null);

            // Helpers
            const getTodayDateStr = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const calendarDays = useMemo(() => {
                const days = [];
                for (let i = -3; i <= 60; i++) {
                    const d = new Date(); d.setDate(d.getDate() + i);
                    const dateStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    days.push({
                        dateStr,
                        label: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }),
                        weekday: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0,3),
                        isToday: i === 0,
                        isPast: i < 0
                    });
                }
                return days;
            }, []);

            const getLogsValue = (dateStr) => {
                if (dateStr > getTodayDateStr()) return 0;
                const log = logs[dateStr];
                return log ? (Number(log.d1) || 0) + (Number(log.d2) || 0) + (Number(log.d3) || 0) : 0;
            };

            const statsCalculated = useMemo(() => {
                const allEntries = Object.values(logs);
                const totalSaidaGeral = allEntries.reduce((acc, curr) => acc + (Number(curr.d1)||0) + (Number(curr.d2)||0) + (Number(curr.d3)||0), 0);
                const todayStr = getTodayDateStr();
                const totalSaidaAteHoje = allEntries.reduce((acc, curr) => curr.data <= todayStr ? acc + (Number(curr.d1)||0) + (Number(curr.d2)||0) + (Number(curr.d3)||0) : acc, 0);
                const totalEntrada = replenishments.reduce((acc, curr) => acc + (curr.isScheduled ? 0 : (Number(curr.amount)||0)), 0);
                return { previsao: estoqueInicialBase + totalEntrada - totalSaidaGeral, estoque: estoqueInicialBase + totalEntrada - totalSaidaAteHoje, totalEntrada };
            }, [logs, replenishments, estoqueInicialBase]);

            const chartDataCalculated = useMemo(() => {
                let data = []; let totalGeral = 0;
                const today = new Date(); today.setHours(0,0,0,0);
                const formatD = (d) => { const offset = d.getTimezoneOffset()*60000; return new Date(d.getTime()-offset).toISOString().split('T')[0]; };
                if (chartType === 'weekly') {
                    let sumAnt = 0;
                    for (let i=13;i>=7;i--) { let d=new Date(today); d.setDate(d.getDate()-i); sumAnt+=getLogsValue(formatD(d)); }
                    data.push({ name:'<', Total:sumAnt, isSpecial:true });
                    for (let i=6;i>=0;i--) { let d=new Date(today); d.setDate(d.getDate()-i); let val=getLogsValue(formatD(d)); data.push({ name:d.toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3), Total:val }); totalGeral+=val; }
                } else if (chartType === 'monthly') {
                    let sumAnt=0;
                    for(let i=28;i<56;i++) { let d=new Date(today); d.setDate(d.getDate()-i); sumAnt+=getLogsValue(formatD(d)); }
                    data.push({ name:'<', Total:sumAnt, isSpecial:true });
                    for(let w=3;w>=0;w--) { let sumW=0; for(let dIdx=0;dIdx<7;dIdx++) { let d=new Date(today); d.setDate(d.getDate()-((w*7)+dIdx)); sumW+=getLogsValue(formatD(d)); } data.push({ name:`Sem ${4-w}`, Total:sumW }); totalGeral+=sumW; }
                } else if (chartType === 'yearly') {
                    let cYear=today.getFullYear(); let cMonth=today.getMonth(); let monthsData=[];
                    for(let i=11;i>=0;i--) { let d=new Date(cYear,cMonth-i,1); let mStr=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; let sumM=0; Object.keys(logs).forEach(date => { if(date.startsWith(mStr)) sumM+=getLogsValue(date); }); monthsData.push({ name:d.toLocaleDateString('pt-BR',{month:'short'}).slice(0,3), Total:sumM, sortKey:mStr }); totalGeral+=sumM; }
                    let oldestM=monthsData[0].sortKey; let sumAnt=0; Object.keys(logs).forEach(date => { if(date.slice(0,7)<oldestM) sumAnt+=getLogsValue(date); });
                    data.push({ name:'<', Total:sumAnt, isSpecial:true }); data=[...data,...monthsData];
                }
                return { data, total: totalGeral };
            }, [logs, chartType]);

            const historyItemsCalculated = useMemo(() => {
                const todayStr = getTodayDateStr();
                const pastLogs = Object.values(logs).filter(l => l.data < todayStr && ((Number(l.d1)||0)+(Number(l.d2)||0)+(Number(l.d3)||0))>0);
                if (pastLogs.length === 0) return [];
                const oldestDateStr = pastLogs.reduce((oldest,curr) => curr.data < oldest.data ? curr : oldest).data;
                const items=[]; let emptyStreak=[]; let currDate=new Date(todayStr+'T12:00:00'); currDate.setDate(currDate.getDate()-1);
                const oldestDateObj=new Date(oldestDateStr+'T12:00:00'); let logCount=0;
                while (currDate >= oldestDateObj) {
                    const dStr=currDate.toISOString().split('T')[0]; const log=logs[dStr]||{ d1:'',d2:'',d3:'',data:dStr }; const total=(Number(log.d1)||0)+(Number(log.d2)||0)+(Number(log.d3)||0);
                    if (total > 0) {
                        if (emptyStreak.length > 5) { items.push({ type:'empty_group', startDate:emptyStreak[emptyStreak.length-1].data, endDate:emptyStreak[0].data, count:emptyStreak.length }); } else if (emptyStreak.length > 0) { emptyStreak.forEach(emptyLog => items.push({ type:'log', log:emptyLog, isEditable:logCount<5 })); }
                        emptyStreak=[]; items.push({ type:'log', log, isEditable:logCount<5 }); logCount++;
                    } else { emptyStreak.push(log); }
                    currDate.setDate(currDate.getDate()-1);
                }
                if (emptyStreak.length > 5) { items.push({ type:'empty_group', startDate:emptyStreak[emptyStreak.length-1].data, endDate:emptyStreak[0].data, count:emptyStreak.length }); } else if (emptyStreak.length > 0) { emptyStreak.forEach(emptyLog => items.push({ type:'log', log:emptyLog, isEditable:logCount<5 })); }
                return items;
            }, [logs]);

            // Functions
            const showToast = (message, type='success') => {
                setToast({ message, type });
                if (toastTimeout.current) clearTimeout(toastTimeout.current);
                toastTimeout.current = setTimeout(() => setToast(null), 3000);
            };

            const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            const calculateDaysAgo = (dateStr) => {
                if (!dateStr) return null;
                const today = new Date(getTodayDateStr()+'T12:00:00');
                const pastDate = new Date(dateStr+'T12:00:00');
                return Math.floor((today - pastDate) / (1000*60*60*24));
            };

            const updateCloud = (updates) => {
                if (!user || !db) return;
                db.collection('medicacao_users').doc(user.uid).update({
                    logs: updates.logs || logs,
                    replenishments: updates.replenishments || replenishments
                }).catch(() => setStatus('Erro Cloud'));
            };

            const handleBackup = () => {
                const data = JSON.stringify({ logs, replenishments });
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
                a.download = `backup_med_${getTodayDateStr()}.json`; a.click();
                showToast("Backup salvo!");
            };

            const handleRestore = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.logs) setLogs(data.logs); if (data.replenishments) setReplenishments(data.replenishments);
                        updateCloud(data); showToast("Restauração concluída!", "success");
                    } catch (err) { showToast("Erro no arquivo.", "error"); }
                };
                reader.readAsText(file); e.target.value = '';
            };

            const handleAuth = async (e) => {
                e.preventDefault(); setAuthError('');
                try {
                    if (isRegisterMode) await auth.createUserWithEmailAndPassword(emailInput, passwordInput);
                    else await auth.signInWithEmailAndPassword(emailInput, passwordInput);
                    showToast("Sucesso!", "success");
                } catch (err) { setAuthError('E-mail ou senha inválidos.'); }
            };

            const handleGoogleLogin = async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    showToast("Login Google realizado!", "success");
                } catch (err) { if (err.code !== 'auth/popup-closed-by-user') setAuthError('Erro no Login Google.'); }
            };

            const handleLogout = () => auth.signOut();

            const handleSupply = () => {
                if (!supplyData.amount) { showToast("Insira a quantidade.", "error"); return; }
                let updated;
                if (supplyData.id) {
                    updated = replenishments.map(r => r.id === supplyData.id ? { ...r, amount: Number(supplyData.amount), date: supplyData.date, isScheduled: supplyData.isScheduled } : r);
                } else {
                    updated = [...replenishments, { amount: Number(supplyData.amount), date: supplyData.date || getTodayDateStr(), isScheduled: supplyData.isScheduled, id: Date.now() }];
                }
                setReplenishments(updated); updateCloud({ replenishments: updated }); setShowSupplyModal(false);
                setSupplyData({ id: null, amount: '', date: '', isScheduled: false });
                showToast("Registro salvo!");
            };

            const confirmPurchase = (id) => {
                const updated = replenishments.map(r => r.id === id ? { ...r, isScheduled: false, date: getTodayDateStr() } : r);
                setReplenishments(updated); updateCloud({ replenishments: updated });
                showToast("Compra confirmada!", "success");
            };

            const deletePurchase = (id) => {
                const updated = replenishments.filter(r => r.id !== id);
                setReplenishments(updated); updateCloud({ replenishments: updated });
                showToast("Excluído.", "error");
            };

            const handleInputChange = (dateStr, field, value) => {
                const curr = logs[dateStr] || { d1:'', d2:'', d3:'', data:dateStr };
                const updatedLogs = { ...logs, [dateStr]: { ...curr, [field]: value==='' ? '' : Number(value) } };
                setLogs(updatedLogs); updateCloud({ logs: updatedLogs });
            };

            const handleInsertRow = (targetDate) => {
                const idx = calendarDays.findIndex(d => d.dateStr === targetDate); if (idx===-1) return;
                const newLogs = { ...logs };
                for (let i=calendarDays.length-1;i>idx;i--) { const prev=calendarDays[i-1].dateStr; const curr=calendarDays[i].dateStr; if (newLogs[prev]) newLogs[curr]={ ...newLogs[prev], data:curr }; else delete newLogs[curr]; }
                delete newLogs[targetDate]; setLogs(newLogs); updateCloud({ logs:newLogs });
            };

            const handleDeleteRow = (targetDate) => {
                const idx = calendarDays.findIndex(d => d.dateStr === targetDate); if (idx===-1) return;
                const newLogs = { ...logs };
                for (let i=idx;i<calendarDays.length-1;i++) { const curr=calendarDays[i].dateStr; const next=calendarDays[i+1].dateStr; if (newLogs[next]) newLogs[curr]={ ...newLogs[next], data:curr }; else delete newLogs[curr]; }
                delete newLogs[calendarDays[calendarDays.length-1].dateStr]; setLogs(newLogs); updateCloud({ logs:newLogs });
            };

            const handleClearRow = (dateStr) => {
                const updated = { ...logs }; delete updated[dateStr];
                setLogs(updated); updateCloud({ logs:updated });
            };

            const handleClearAll = () => {
                const today = getTodayDateStr(); const updated = {};
                Object.keys(logs).forEach(k => { if (k < today) updated[k] = logs[k]; });
                setLogs(updated); updateCloud({ logs:updated }); showToast("Grade limpa!");
            };

            const onInputFocus = () => {
                if (!isMobileDevice()) return;
                if (keyboardTimeoutRef.current) clearTimeout(keyboardTimeoutRef.current);
                setIsKeyboardVisible(true); setForceShowNav(false);
            };

            const onInputBlur = () => {
                if (!isMobileDevice()) return;
                if (keyboardTimeoutRef.current) clearTimeout(keyboardTimeoutRef.current);
                setIsKeyboardVisible(false); setForceShowNav(false);
            };

            const handleKeyDown = (e, dayIdx, doseNum) => {
                const keys = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
                if (!keys.includes(e.key)) return;
                let nextDayIdx=dayIdx, nextDoseNum=doseNum;
                if (e.key==='ArrowRight') { if (doseNum<3) { nextDoseNum++; } else if (dayIdx<calendarDays.length-1) { nextDayIdx++; nextDoseNum=1; } }
                else if (e.key==='ArrowLeft') { if (doseNum>1) { nextDoseNum--; } else if (dayIdx>0) { nextDayIdx--; nextDoseNum=3; } }
                else if (e.key==='ArrowDown') { if (dayIdx<calendarDays.length-1) nextDayIdx++; }
                else if (e.key==='ArrowUp') { if (dayIdx>0) nextDayIdx--; }
                if (nextDayIdx!==dayIdx || nextDoseNum!==doseNum) {
                    e.preventDefault();
                    const targetEl = document.getElementById(`dose-${calendarDays[nextDayIdx].dateStr}-${nextDoseNum}`);
                    if (targetEl) targetEl.focus();
                }
            };

            const handleInstallApp = async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') { setDeferredPrompt(null); showToast("Instalação iniciada!"); }
                } else {
                    showToast("O instalador não está pronto. Tente usar 'Adicionar à tela de início' no menu do Chrome.", "error");
                }
            };

            // Effects
            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => { setUser(u); setAuthLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                localStorage.setItem('tramal_app_final_logs', JSON.stringify(logs));
                localStorage.setItem('tramal_app_final_supply', JSON.stringify(replenishments));
            }, [logs, replenishments, user]);

            useEffect(() => {
                if (!user || !db) return;
                const unsub = db.collection('medicacao_users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.logs) setLogs(data.logs);
                        if (data.replenishments) setReplenishments(data.replenishments);
                    } else {
                        db.collection('medicacao_users').doc(user.uid).set({ logs, replenishments });
                    }
                }, (error) => console.log("Firebase Error:", error));
                return () => unsub();
            }, [user]);

            useEffect(() => {
                if (activeTab === 'agenda' && todayRowRef.current) {
                    setTimeout(() => { todayRowRef.current.scrollIntoView({ behavior:'smooth', block:'start' }); }, 100);
                }
            }, [activeTab]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => { e.preventDefault(); setDeferredPrompt(e); };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            // --- LOADING ---
            if (authLoading) return (
                <div style={{ minHeight:'100vh', background:'var(--bg-deep)', display:'flex', alignItems:'center', justifyContent:'center' }}>
                    <div className="loader-ring" />
                </div>
            );

            // --- AUTH SCREEN ---
            if (!user) {
                return (
                    <div className="auth-bg" style={{ minHeight:'100vh', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', padding:'24px' }}>
                        <ToastComponent toast={toast} />
                        <div style={{ width:'100%', maxWidth:'320px' }} className="animate-fade">
                            {/* Logo */}
                            <div style={{ textAlign:'center', marginBottom:'40px' }}>
                                <div style={{ width:'72px', height:'72px', borderRadius:'22px', background:'var(--accent-dim)', border:'1px solid rgba(45,212,191,0.2)', display:'flex', alignItems:'center', justifyContent:'center', margin:'0 auto 20px' }}>
                                    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" style={{ width:'44px', height:'44px', filter:'brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(140deg)' }} alt="Logo" />
                                </div>
                                <h1 style={{ fontFamily:'Syne', fontWeight:800, fontSize:'36px', letterSpacing:'-0.02em', color:'var(--text-1)', lineHeight:1 }}>APP MED</h1>
                                <p style={{ fontFamily:'Syne', fontWeight:700, fontSize:'10px', letterSpacing:'0.2em', color:'var(--accent)', textTransform:'uppercase', marginTop:'6px' }}>
                                    {isRegisterMode ? 'Nova Conta' : 'Acesso Restrito'}
                                </p>
                            </div>

                            {/* Form */}
                            <form onSubmit={handleAuth} style={{ display:'flex', flexDirection:'column', gap:'12px' }}>
                                <input type="email" required className="auth-input" value={emailInput} onChange={e=>setEmailInput(e.target.value)} placeholder="Seu e-mail" />
                                <input type="password" required className="auth-input" style={{ letterSpacing:'0.15em', fontSize:'18px', fontWeight:700 }} value={passwordInput} onChange={e=>setPasswordInput(e.target.value)} placeholder="Senha" />
                                {authError && <p style={{ fontFamily:'Syne', color:'#f43f5e', fontSize:'10px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', textAlign:'center' }}>{authError}</p>}
                                <button type="submit" className="btn-accent" style={{ padding:'16px', fontSize:'12px', marginTop:'4px' }}>
                                    {isRegisterMode ? 'Registrar' : 'Entrar'}
                                </button>
                            </form>

                            {/* Divider */}
                            <div style={{ display:'flex', alignItems:'center', gap:'12px', margin:'20px 0' }}>
                                <div style={{ flex:1, height:'1px', background:'var(--border)' }} />
                                <span style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, letterSpacing:'0.1em', color:'var(--text-3)', textTransform:'uppercase' }}>ou</span>
                                <div style={{ flex:1, height:'1px', background:'var(--border)' }} />
                            </div>

                            {/* Google */}
                            <button onClick={handleGoogleLogin} style={{ width:'100%', padding:'14px', background:'#fff', color:'#111827', borderRadius:'14px', fontFamily:'Syne', fontWeight:700, fontSize:'12px', letterSpacing:'0.04em', display:'flex', alignItems:'center', justifyContent:'center', gap:'10px', boxShadow:'0 4px 20px rgba(0,0,0,0.3)', border:'none', cursor:'pointer' }}>
                                <IconGoogle /> Login com Google
                            </button>

                            <button onClick={() => setIsRegisterMode(!isRegisterMode)} style={{ display:'block', margin:'20px auto 0', fontFamily:'Syne', fontSize:'10px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.1em', color:'var(--text-3)', background:'none', border:'none', cursor:'pointer' }}>
                                {isRegisterMode ? 'Já tenho conta' : 'Criar uma conta'}
                            </button>
                        </div>
                    </div>
                );
            }

            // --- MAIN APP ---
            return (
                <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column', background:'var(--bg-deep)' }}>
                    <ToastComponent toast={toast} />

                    {/* HEADER */}
                    <header style={{ position:'sticky', top:0, zIndex:40, background:'rgba(8,12,24,0.92)', backdropFilter:'blur(24px)', borderBottom:'1px solid var(--border)', padding:'14px 16px 14px' }}>
                        <div style={{ maxWidth:'480px', margin:'0 auto', display:'flex', justifyContent:'space-between', alignItems:'center', gap:'12px' }}>
                            {/* Left: Logo + Status */}
                            <div style={{ display:'flex', alignItems:'center', gap:'10px' }}>
                                <div style={{ width:'36px', height:'36px', borderRadius:'12px', background:'var(--accent-dim)', border:'1px solid rgba(45,212,191,0.2)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                                    <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" style={{ width:'22px', height:'22px', filter:'brightness(0) invert(1) sepia(1) saturate(3) hue-rotate(140deg)', opacity:0.9 }} alt="Logo" />
                                </div>
                                <div>
                                    <h1 style={{ fontFamily:'Syne', fontWeight:800, fontSize:'18px', letterSpacing:'-0.01em', color:'var(--text-1)', lineHeight:1, margin:0 }}>APP MED</h1>
                                    <div style={{ display:'flex', alignItems:'center', gap:'5px', marginTop:'2px' }}>
                                        <span style={{ color:'var(--accent)', opacity:0.8 }}><IconCloud /></span>
                                        <span style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, letterSpacing:'0.08em', textTransform:'uppercase', color:'var(--accent)', opacity:0.8 }}>{status}</span>
                                        <button onClick={handleLogout} style={{ marginLeft:'6px', background:'none', border:'none', cursor:'pointer', color:'rgba(244,63,94,0.6)', padding:'2px', display:'flex' }} title="Sair">
                                            <IconLogout />
                                        </button>
                                    </div>
                                </div>
                            </div>

                            {/* Right: Previsão badge */}
                            <div style={{
                                padding:'8px 16px',
                                borderRadius:'14px',
                                background: statsCalculated.previsao < 0 ? 'var(--rose-dim)' : 'var(--accent-dim)',
                                border: `1px solid ${statsCalculated.previsao < 0 ? 'rgba(244,63,94,0.25)' : 'rgba(45,212,191,0.2)'}`,
                                textAlign:'center',
                                flexShrink:0
                            }}>
                                <div style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', color: statsCalculated.previsao < 0 ? '#f43f5e' : 'var(--accent)', opacity:0.7, lineHeight:1 }}>Previsão</div>
                                <div style={{ fontFamily:'Syne', fontWeight:800, fontSize:'24px', lineHeight:1.1, color: statsCalculated.previsao < 0 ? '#f43f5e' : 'var(--accent)', marginTop:'2px' }}>{statsCalculated.previsao}</div>
                            </div>
                        </div>
                    </header>

                    {/* MAIN CONTENT */}
                    <main style={{ flex:1, maxWidth:'480px', width:'100%', margin:'0 auto', padding:'16px 14px 110px', boxSizing:'border-box' }}>

                        {/* ── DASHBOARD ── */}
                        {activeTab === 'dashboard' && (
                            <div className="animate-fade" style={{ display:'flex', flexDirection:'column', gap:'14px', paddingTop:'4px' }}>

                                {/* Stock card */}
                                <div className="card-elevated" style={{ padding:'24px 20px', textAlign:'center' }}>
                                    <p style={{ fontFamily:'Syne', fontSize:'10px', fontWeight:700, letterSpacing:'0.14em', textTransform:'uppercase', color:'var(--text-3)', marginBottom:'6px' }}>Estoque Real</p>
                                    <p className={statsCalculated.estoque < 0 ? 'stock-glow-red' : 'stock-glow'} style={{ fontFamily:'Syne', fontWeight:800, fontSize:'56px', lineHeight:1, color: statsCalculated.estoque < 0 ? '#f43f5e' : '#2dd4bf', marginBottom:'20px' }}>
                                        {statsCalculated.estoque}
                                    </p>
                                    <button onClick={() => { setSupplyData({ id:null, amount:'', date:getTodayDateStr(), isScheduled:false }); setShowSupplyModal(true); }} className="btn-accent" style={{ width:'100%', padding:'14px', fontSize:'11px', marginBottom:'10px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', border:'none', cursor:'pointer' }}>
                                        <IconPlus /> REGISTRAR COMPRA
                                    </button>
                                    <button onClick={handleInstallApp} className="btn-ghost" style={{ width:'100%', padding:'13px', fontSize:'10px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', cursor:'pointer', border:'none' }}>
                                        <span style={{ color:'var(--accent)' }}><IconDevice /></span> INSTALAR APLICATIVO
                                    </button>
                                </div>

                                {/* Chart card */}
                                <div className="card" style={{ padding:'20px' }}>
                                    <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:'16px' }}>
                                        <p style={{ fontFamily:'Syne', fontSize:'10px', fontWeight:700, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--text-3)', margin:0 }}>Gráfico de Uso</p>
                                        <div className="pill-toggle" style={{ display:'flex' }}>
                                            {['weekly','monthly','yearly'].map((t,i) => (
                                                <button key={t} onClick={() => setChartType(t)} className={`pill-opt ${chartType===t ? 'pill-opt-active' : ''}`} style={{ background:'none', border:'none', cursor:'pointer' }}>
                                                    {['Sem','Mês','Ano'][i]}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                    <div style={{ background:'var(--accent-dim)', border:'1px solid rgba(45,212,191,0.15)', borderRadius:'12px', padding:'10px', textAlign:'center', marginBottom:'16px' }}>
                                        <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:'20px', color:'var(--accent)' }}>{chartDataCalculated.total}</span>
                                        <span style={{ fontFamily:'Syne', fontWeight:600, fontSize:'11px', color:'var(--text-3)', marginLeft:'6px' }}>cápsulas</span>
                                    </div>
                                    <div style={{ height:'180px', width:'100%' }}>
                                        <ManualBarChart data={chartDataCalculated.data} />
                                    </div>
                                </div>

                                {/* Backup / Restore */}
                                <div style={{ display:'flex', gap:'10px' }}>
                                    <button onClick={handleBackup} className="btn-ghost" style={{ flex:1, padding:'14px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', fontSize:'10px', cursor:'pointer', border:'1px solid var(--border)' }}>
                                        <span style={{ color:'#a78bfa' }}><IconDownload /></span> Backup
                                    </button>
                                    <button onClick={() => fileInputRef.current.click()} className="btn-ghost" style={{ flex:1, padding:'14px', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', fontSize:'10px', cursor:'pointer', border:'1px solid var(--border)' }}>
                                        <span style={{ color:'var(--accent)' }}><IconUpload /></span> Restaurar
                                    </button>
                                </div>
                                <input type="file" ref={fileInputRef} style={{ display:'none' }} accept=".json" onChange={handleRestore} />
                            </div>
                        )}

                        {/* ── AGENDA ── */}
                        {activeTab === 'agenda' && (
                            <div className="animate-fade" style={{ marginTop:'4px' }}>
                                <div className="card" style={{ overflow:'hidden', borderRadius:'20px' }}>
                                    {/* Header */}
                                    <div style={{ padding:'14px 16px', background:'var(--bg-card2)', borderBottom:'1px solid var(--border)', display:'flex', justifyContent:'space-between', alignItems:'center' }}>
                                        <span style={{ fontFamily:'Syne', fontSize:'10px', fontWeight:800, letterSpacing:'0.12em', textTransform:'uppercase', color:'var(--accent)' }}>Grade de Lançamento</span>
                                        <button onClick={handleClearAll} style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.08em', color:'rgba(244,63,94,0.6)', background:'none', border:'none', cursor:'pointer' }}>
                                            Limpar Tudo
                                        </button>
                                    </div>
                                    {/* Rows */}
                                    <div className="scrollbar-hide" style={{ maxHeight:'64vh', overflowY:'auto', padding:'10px 10px', display:'flex', flexDirection:'column', gap:'6px' }}>
                                        {calendarDays.map((day, dIdx) => {
                                            const log = logs[day.dateStr] || { d1:'', d2:'', d3:'' };
                                            const total = (Number(log.d1)||0)+(Number(log.d2)||0)+(Number(log.d3)||0);
                                            const totalSaidaAteData = Object.values(logs).reduce((acc,curr) => curr.data <= day.dateStr ? acc+(Number(curr.d1)||0)+(Number(curr.d2)||0)+(Number(curr.d3)||0) : acc, 0);
                                            const runningStock = estoqueInicialBase + statsCalculated.totalEntrada - totalSaidaAteData;

                                            let rowClass = day.isPast ? 'agenda-row-past' : day.isToday ? 'agenda-row-today' : 'agenda-row';
                                            let dateBadgeClass = day.isPast ? 'date-badge-past' : day.isToday ? 'date-badge-today' : 'date-badge';
                                            let totalBadgeClass = runningStock <= 0 && !day.isPast ? 'total-badge-red' : total > 0 ? (day.isPast ? 'total-badge-past' : 'total-badge-filled') : 'total-badge';

                                            return (
                                                <div key={day.dateStr} ref={day.isToday ? todayRowRef : null} className={rowClass} style={{ display:'flex', alignItems:'center', gap:'6px', padding:'8px 8px' }}>
                                                    {/* Insert/Delete row buttons */}
                                                    <div style={{ display:'flex', flexDirection:'column', gap:'3px', width:'22px', flexShrink:0 }}>
                                                        <button onClick={() => handleInsertRow(day.dateStr)} style={{ background:'rgba(45,212,191,0.1)', color:'var(--accent)', border:'none', borderRadius:'7px', padding:'5px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}><IconInsertRow /></button>
                                                        <button onClick={() => handleDeleteRow(day.dateStr)} style={{ background:'var(--rose-dim)', color:'var(--rose)', border:'none', borderRadius:'7px', padding:'5px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center' }}><IconDeleteRow /></button>
                                                    </div>
                                                    {/* Date badge */}
                                                    <div className={dateBadgeClass} style={{ width:'40px', height:'44px', borderRadius:'12px', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                                                        <span style={{ fontFamily:'Syne', fontSize:'8px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.05em', lineHeight:1 }}>{day.weekday}</span>
                                                        <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:'17px', lineHeight:1.1 }}>{day.label.split('/')[0]}</span>
                                                    </div>
                                                    {/* Dose inputs */}
                                                    <div style={{ flex:1, display:'flex', justifyContent:'center', gap:'5px' }}>
                                                        {[1,2,3].map(num => (
                                                            <input
                                                                key={num}
                                                                id={`dose-${day.dateStr}-${num}`}
                                                                type="number"
                                                                placeholder="—"
                                                                className="dose-input"
                                                                value={log[`d${num}`]}
                                                                onFocus={onInputFocus}
                                                                onBlur={onInputBlur}
                                                                onKeyDown={(e) => handleKeyDown(e, dIdx, num)}
                                                                onChange={e => handleInputChange(day.dateStr, `d${num}`, e.target.value)}
                                                            />
                                                        ))}
                                                    </div>
                                                    {/* Total badge */}
                                                    <div style={{ width:'32px', flexShrink:0, display:'flex', justifyContent:'center' }}>
                                                        <span className={totalBadgeClass} style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'32px', height:'32px', fontFamily:'Syne', fontWeight:800, fontSize:'13px' }}>
                                                            {total || '—'}
                                                        </span>
                                                    </div>
                                                    {/* Clear row */}
                                                    <div style={{ width:'22px', flexShrink:0 }}>
                                                        <button onClick={() => handleClearRow(day.dateStr)} style={{ background:'none', border:'none', color:'rgba(244,63,94,0.4)', cursor:'pointer', padding:'4px', display:'flex' }}>
                                                            <IconX />
                                                        </button>
                                                    </div>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* ── HISTORY ── */}
                        {activeTab === 'history' && (
                            <div className="animate-fade" style={{ paddingTop:'8px', display:'flex', flexDirection:'column', gap:'8px' }}>
                                <p className="section-label" style={{ paddingLeft:'4px', paddingBottom:'4px' }}>Histórico de Registros</p>
                                <div style={{ display:'flex', flexDirection:'column', gap:'6px', paddingBottom:'20px' }}>
                                    {historyItemsCalculated.map((item) => item.type === 'empty_group' ? (
                                        <div key={item.startDate} className="empty-group">Vazio: {item.count} dias</div>
                                    ) : (
                                        <div key={item.log.data} style={{ display:'flex', alignItems:'center', gap:'8px', padding:'8px 10px', background:'var(--bg-card)', border:'1px solid var(--border)', borderRadius:'16px' }}>
                                            {/* Clear btn */}
                                            <button onClick={() => handleClearRow(item.log.data)} style={{ background:'var(--rose-dim)', color:'var(--rose)', border:'none', borderRadius:'9px', padding:'7px', cursor:'pointer', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                                                <IconMinus />
                                            </button>
                                            {/* Date */}
                                            <div style={{ width:'40px', height:'44px', borderRadius:'12px', background:'var(--bg-card2)', border:'1px solid var(--border)', display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                                                <span style={{ fontFamily:'Syne', fontSize:'8px', fontWeight:700, textTransform:'uppercase', color:'var(--text-3)', lineHeight:1 }}>{new Date(item.log.data+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short'}).slice(0,3)}</span>
                                                <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:'17px', color:'var(--text-2)', lineHeight:1.1 }}>{item.log.data.split('-')[2]}</span>
                                            </div>
                                            {/* Dose inputs */}
                                            <div style={{ flex:1, display:'flex', justifyContent:'center', gap:'5px' }}>
                                                {[1,2,3].map(num => (
                                                    <input
                                                        key={num}
                                                        type="number"
                                                        placeholder="—"
                                                        disabled={!item.isEditable}
                                                        className="dose-input-sm"
                                                        value={item.log[`d${num}`]}
                                                        onFocus={onInputFocus}
                                                        onBlur={onInputBlur}
                                                        onChange={e => handleInputChange(item.log.data, `d${num}`, e.target.value)}
                                                    />
                                                ))}
                                            </div>
                                            {/* Total */}
                                            <div style={{ width:'32px', flexShrink:0, display:'flex', justifyContent:'center' }}>
                                                <span style={{ display:'flex', alignItems:'center', justifyContent:'center', width:'32px', height:'32px', fontFamily:'Syne', fontWeight:800, fontSize:'13px', background:'var(--bg-card2)', color:'var(--text-2)', border:'1px solid var(--border)', borderRadius:'10px' }}>
                                                    {(Number(item.log.d1)||0)+(Number(item.log.d2)||0)+(Number(item.log.d3)||0)}
                                                </span>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* ── PURCHASES ── */}
                        {activeTab === 'purchases' && (
                            <div className="animate-fade" style={{ paddingTop:'8px', display:'flex', flexDirection:'column', gap:'10px' }}>
                                <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', paddingLeft:'4px' }}>
                                    <p className="section-label">Compras e Agendamentos</p>
                                    <button
                                        onClick={() => { setSupplyData({ id:null, amount:'', date:getTodayDateStr(), isScheduled:false }); setShowSupplyModal(true); }}
                                        style={{ background:'var(--accent-dim)', color:'var(--accent)', border:'1px solid rgba(45,212,191,0.2)', borderRadius:'999px', padding:'7px 14px', fontFamily:'Syne', fontWeight:700, fontSize:'9px', letterSpacing:'0.08em', textTransform:'uppercase', display:'flex', alignItems:'center', gap:'5px', cursor:'pointer' }}
                                    >
                                        <IconPlus /> Registrar Compra
                                    </button>
                                </div>

                                <div style={{ display:'flex', flexDirection:'column', gap:'8px', paddingBottom:'20px' }}>
                                    {[...replenishments].sort((a,b) => new Date(b.date)-new Date(a.date)||b.id-a.id).map(compra => {
                                        const days = calculateDaysAgo(compra.date);
                                        const isAg = compra.isScheduled;
                                        return (
                                            <div key={compra.id} className={isAg ? 'purchase-card-scheduled' : 'purchase-card'} style={{ padding:'14px' }}>
                                                <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:'10px' }}>
                                                    <div style={{ display:'flex', alignItems:'center', gap:'12px', flex:1, minWidth:0 }}>
                                                        {/* Delete btn */}
                                                        <button onClick={() => deletePurchase(compra.id)} style={{ width:'32px', height:'32px', background:'var(--rose-dim)', color:'var(--rose)', border:'none', borderRadius:'999px', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer', flexShrink:0 }}>
                                                            <IconMinus />
                                                        </button>
                                                        {/* Date icon */}
                                                        <div style={{ width:'48px', height:'48px', borderRadius:'14px', background: isAg ? 'var(--amber-dim)' : 'var(--accent-dim)', border:`1px solid ${isAg ? 'rgba(251,191,36,0.2)' : 'rgba(45,212,191,0.2)'}`, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', flexShrink:0 }}>
                                                            <span style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, textTransform:'uppercase', color: isAg ? '#fbbf24' : 'var(--accent)', opacity:0.7, lineHeight:1 }}>{new Date(compra.date+'T12:00:00').toLocaleDateString('pt-BR',{month:'short'})}</span>
                                                            <span style={{ fontFamily:'Syne', fontWeight:800, fontSize:'18px', color: isAg ? '#fbbf24' : 'var(--accent)', lineHeight:1.1 }}>{compra.date.split('-')[2]}</span>
                                                        </div>
                                                        {/* Info */}
                                                        <div style={{ flex:1, minWidth:0 }}>
                                                            <p style={{ fontFamily:'Syne', fontWeight:800, fontSize:'18px', color: isAg ? '#fbbf24' : 'var(--accent)', lineHeight:1, margin:0 }}>
                                                                {compra.amount} <span style={{ fontFamily:'DM Sans', fontSize:'9px', fontWeight:500, opacity:0.6, textTransform:'uppercase', letterSpacing:'0.06em' }}>Cápsulas</span>
                                                            </p>
                                                            <span style={{ display:'inline-block', marginTop:'5px', fontFamily:'Syne', fontSize:'8px', fontWeight:700, letterSpacing:'0.1em', textTransform:'uppercase', padding:'3px 8px', borderRadius:'6px', background: isAg ? 'rgba(251,191,36,0.12)' : days===0 ? 'var(--accent-dim)' : 'rgba(255,255,255,0.04)', color: isAg ? '#fbbf24' : days===0 ? 'var(--accent)' : 'var(--text-3)' }}>
                                                                {isAg ? 'Agendado' : days===0 ? 'Hoje' : `Há ${days} dias`}
                                                            </span>
                                                        </div>
                                                    </div>
                                                    {/* Actions */}
                                                    <div style={{ display:'flex', flexDirection:'column', gap:'5px', flexShrink:0 }}>
                                                        {isAg && (
                                                            <button onClick={() => confirmPurchase(compra.id)} style={{ padding:'8px 12px', background:'var(--accent)', color:'#080c18', borderRadius:'10px', fontFamily:'Syne', fontWeight:700, fontSize:'9px', letterSpacing:'0.08em', textTransform:'uppercase', border:'none', cursor:'pointer' }}>Confirmar</button>
                                                        )}
                                                        <button onClick={() => { setSupplyData({ id:compra.id, amount:compra.amount, date:compra.date, isScheduled:compra.isScheduled }); setShowSupplyModal(true); }} style={{ padding:'8px 12px', background:'var(--bg-card2)', color:'var(--text-2)', borderRadius:'10px', fontFamily:'Syne', fontWeight:700, fontSize:'9px', letterSpacing:'0.08em', textTransform:'uppercase', border:'1px solid var(--border)', cursor:'pointer' }}>Editar</button>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {/* ── SUPPLY MODAL ── */}
                    {showSupplyModal && (
                        <div className="modal-backdrop animate-fade" style={{ position:'fixed', inset:0, zIndex:100, display:'flex', alignItems:'flex-end', justifyContent:'center' }}>
                            <div className="modal-sheet animate-slide-up" style={{ width:'100%', maxWidth:'480px', padding:'24px 24px 40px' }}>
                                <div className="modal-accent-top" />
                                <h2 style={{ fontFamily:'Syne', fontWeight:800, fontSize:'18px', textAlign:'center', textTransform:'uppercase', letterSpacing:'0.04em', color:'var(--text-1)', margin:'0 0 24px' }}>
                                    {supplyData.id ? (supplyData.isScheduled ? 'Ajustar Agenda' : 'Editar Compra') : (supplyData.isScheduled ? 'Novo Agendamento' : 'Novo Registro')}
                                </h2>
                                <div style={{ display:'flex', flexDirection:'column', gap:'12px', marginBottom:'24px' }}>
                                    {/* Amount */}
                                    <div style={{ background: supplyData.isScheduled ? 'var(--amber-dim)' : 'var(--accent-dim)', border:`1px solid ${supplyData.isScheduled ? 'rgba(251,191,36,0.2)' : 'rgba(45,212,191,0.2)'}`, borderRadius:'16px', padding:'16px' }}>
                                        <label style={{ fontFamily:'Syne', fontSize:'9px', fontWeight:700, textTransform:'uppercase', letterSpacing:'0.12em', color: supplyData.isScheduled ? '#fbbf24' : 'var(--accent)', display:'block', marginBottom:'6px' }}>Qtd (Cápsulas)</label>
                                        <input type="number" placeholder="0" style={{ width:'100%', fontFamily:'Syne', fontWeight:800, fontSize:'40px', textAlign:'center', background:'transparent', border:'none', outline:'none', color: supplyData.isScheduled ? '#fbbf24' : 'var(--accent)' }} value={supplyData.amount} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, amount:e.target.value})} />
                                    </div>
                                    {/* Date */}
                                    <input type="date" style={{ width:'100%', background:'var(--bg-deep)', border:'1px solid var(--border)', borderRadius:'14px', padding:'14px 16px', color:'var(--text-1)', fontFamily:'DM Sans', fontWeight:600, fontSize:'14px', outline:'none', colorScheme:'dark' }} value={supplyData.date} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, date:e.target.value})} />
                                    {/* Schedule toggle */}
                                    <button type="button" onClick={() => setSupplyData({...supplyData, isScheduled:!supplyData.isScheduled})} style={{ width:'100%', padding:'14px', borderRadius:'14px', fontFamily:'Syne', fontWeight:700, fontSize:'10px', letterSpacing:'0.1em', textTransform:'uppercase', display:'flex', alignItems:'center', justifyContent:'center', gap:'8px', background: supplyData.isScheduled ? 'var(--amber-dim)' : 'var(--bg-card2)', border:`1px solid ${supplyData.isScheduled ? 'rgba(251,191,36,0.3)' : 'var(--border)'}`, color: supplyData.isScheduled ? '#fbbf24' : 'var(--text-3)', cursor:'pointer' }}>
                                        <IconClock /> {supplyData.isScheduled ? 'Compra agendada' : 'Agendar esta compra'}
                                    </button>
                                </div>
                                {/* Actions */}
                                <div style={{ display:'flex', gap:'10px' }}>
                                    <button onClick={() => setShowSupplyModal(false)} style={{ flex:1, padding:'15px', background:'var(--bg-deep)', border:'1px solid var(--border)', borderRadius:'14px', fontFamily:'Syne', fontWeight:700, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.08em', color:'var(--text-3)', cursor:'pointer' }}>Voltar</button>
                                    <button onClick={handleSupply} style={{ flex:2, padding:'15px', background: supplyData.isScheduled ? '#fbbf24' : 'linear-gradient(135deg,#0d9488,#2dd4bf)', border:'none', borderRadius:'14px', fontFamily:'Syne', fontWeight:700, fontSize:'11px', textTransform:'uppercase', letterSpacing:'0.08em', color: supplyData.isScheduled ? '#080c18' : '#fff', cursor:'pointer', boxShadow: supplyData.isScheduled ? '0 4px 20px rgba(251,191,36,0.25)' : '0 4px 20px rgba(45,212,191,0.25)' }}>Salvar</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* ── BOTTOM NAV ── */}
                    <nav className="glass-nav" style={{
                        position:'fixed', bottom:0, left:0, right:0, zIndex:40,
                        display:'flex', justifyContent:'space-around', alignItems:'center',
                        padding:'10px 8px 28px',
                        transform: (isKeyboardVisible && !forceShowNav) ? 'translateY(100%)' : 'translateY(0)',
                        opacity: (isKeyboardVisible && !forceShowNav) ? 0 : 1,
                        pointerEvents: (isKeyboardVisible && !forceShowNav) ? 'none' : 'auto',
                        transition: 'transform 0.4s cubic-bezier(0.16,1,0.3,1), opacity 0.3s ease'
                    }}>
                        {[
                            { key:'dashboard', label:'Início',    icon:<IconHome /> },
                            { key:'agenda',    label:'Lançar',   icon:<IconTable /> },
                            { key:'history',   label:'Registros', icon:<IconHistory /> },
                            { key:'purchases', label:'Compras',  icon:<IconBag /> },
                        ].map(tab => (
                            <button key={tab.key} onClick={() => setActiveTab(tab.key)} style={{ background:'none', border:'none', cursor:'pointer', display:'flex', flexDirection:'column', alignItems:'center', gap:'3px', padding:'6px 16px', color: activeTab===tab.key ? 'var(--accent)' : 'var(--text-3)', transition:'color 0.2s' }}>
                                <span style={{ transform: activeTab===tab.key ? 'scale(1.1)' : 'scale(1)', transition:'transform 0.2s' }}>{tab.icon}</span>
                                <span style={{ fontFamily:'Syne', fontWeight:700, fontSize:'8px', letterSpacing:'0.1em', textTransform:'uppercase' }}>{tab.label}</span>
                                <div className="nav-dot" style={{ opacity: activeTab===tab.key ? 1 : 0, width:'4px', height:'4px', borderRadius:'50%', background:'var(--accent)', transition:'opacity 0.2s' }} />
                            </button>
                        ))}
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
