<body class="text-slate-800">

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // --- Configuração do Firebase ---
        const firebaseConfig = {
            apiKey: "AIzaSyCVuPb0tji1Xd3qgzGsAVW-X4GyRwQpSdo",
            authDomain: "medicacao-afb43.firebaseapp.com",
            projectId: "medicacao-afb43",
            storageBucket: "medicacao-afb43.firebasestorage.app",
            messagingSenderId: "106132279676",
            appId: "1:106132279676:web:eb94017be76a71f67b14f9"
        };
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();

        // --- Ícones Globais ---
        const IconHome = () => <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>;
        const IconTable = () => <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M12 3v18"></path><rect width="18" height="18" x="3" y="3" rx="2"></rect><path d="M3 9h18"></path><path d="M3 15h18"></path></svg>;
        const IconHistory = () => <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><path d="M12 7v5l4 2"></path></svg>;
        const IconPlus = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconCheck = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>;
        const IconCloud = () => <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" strokeWidth="2" fill="none"><path d="M17.5 19c2.5 0 4.5-2 4.5-4.5 0-2.4-1.9-4.3-4.2-4.5C17.3 6.6 14.4 4 11 4 7.6 4 4.8 6.6 4.2 10.1 1.9 10.3 0 12.3 0 14.7 0 17.1 1.9 19 4.3 19h13.2Z"/></svg>;
        const IconX = () => <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const IconBag = () => <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"></path><path d="M3 6h18"></path><path d="M16 10a4 4 0 0 1-8 0"></path></svg>;
        const IconDownload = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>;
        const IconUpload = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>;
        const IconInsertRow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 4v16M4 12h16"></path></svg>;
        const IconDeleteRow = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M4 12h16"></path></svg>;
        const IconMinus = () => <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>;
        const IconLogout = () => <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>;
        const IconAlertCircle = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>;
        const IconGoogle = () => <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>;
        const IconClock = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>;
        const IconDevice = () => <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"></rect><line x1="12" y1="18" x2="12.01" y2="18"></line></svg>;

        // --- Componente de Notificação ---
        const ToastComponent = ({ toast }) => {
            if (!toast) return null;
            const isError = toast.type === 'error';
            return (
                <div className="fixed top-6 left-1/2 -translate-x-1/2 z-[200] animate-slide-up w-full max-w-xs px-4">
                    <div className={`flex items-center p-4 rounded-xl shadow-lg border ${isError ? 'bg-rose-50 border-rose-100 text-rose-600' : 'bg-indigo-50 border-indigo-100 text-indigo-700'}`}>
                        {isError ? <IconAlertCircle /> : <IconCheck />}
                        <span className="ml-3 font-semibold text-sm leading-tight">{toast.message}</span>
                    </div>
                </div>
            );
        };

        const ManualBarChart = ({ data }) => {
            const maxVal = Math.max(...data.map(d => d.Total), 1);
            const textClass = data.length > 8 ? "text-[8px]" : "text-[10px]";
            return (
                <div className="flex items-end justify-between h-full pt-2 pb-2 px-1 gap-1">
                    {data.map((d, i) => (
                        <div key={i} className="flex flex-col items-center justify-end h-full flex-1 min-w-0">
                            <span className={`${textClass} font-bold text-slate-500 mb-1 whitespace-nowrap overflow-visible w-max max-w-none text-center`}>{d.Total > 0 ? d.Total : ''}</span>
                            <div className="w-full max-w-[28px] rounded-t-sm transition-all duration-500"
                                style={{ height: `${(d.Total / maxVal) * 100}%`, backgroundColor: d.isSpecial ? '#94a3b8' : (d.Total > 0 ? '#4f46e5' : '#f1f5f9'), minHeight: d.Total > 0 ? '6px' : '3px' }}>
                            </div>
                            <span className={`${textClass} font-semibold ${d.isSpecial ? 'text-slate-400' : 'text-slate-400'} mt-1 truncate w-full text-center leading-tight`}>{d.name}</span>
                        </div>
                    ))}
                </div>
            );
        };

        const App = () => {
            // --- CONSTANTES ---
            const estoqueInicialBase = 54;

            // --- ESTADOS ---
            const [user, setUser] = useState(null);
            const [authLoading, setAuthLoading] = useState(true);
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [isRegisterMode, setIsRegisterMode] = useState(false);
            const [authError, setAuthError] = useState('');
            const [activeTab, setActiveTab] = useState('dashboard');
            const [status, setStatus] = useState('Gestão Cloud');
            const [logs, setLogs] = useState(() => JSON.parse(localStorage.getItem('tramal_app_final_logs') || '{}'));
            const [replenishments, setReplenishments] = useState(() => JSON.parse(localStorage.getItem('tramal_app_final_supply') || '[]'));
            const [chartType, setChartType] = useState('weekly');
            const [isKeyboardVisible, setIsKeyboardVisible] = useState(false);
            const [forceShowNav, setForceShowNav] = useState(false);
            const [showSupplyModal, setShowSupplyModal] = useState(false);
            const [supplyData, setSupplyData] = useState({ id: null, amount: '', date: '', isScheduled: false });
            const [toast, setToast] = useState(null);
            const [deferredPrompt, setDeferredPrompt] = useState(null);

            const keyboardTimeoutRef = useRef(null);
            const fileInputRef = useRef(null);
            const todayRowRef = useRef(null);
            const toastTimeout = useRef(null);

            // --- CÁLCULOS ---

            const getTodayDateStr = () => {
                const d = new Date();
                const offset = d.getTimezoneOffset() * 60000;
                return new Date(d.getTime() - offset).toISOString().split('T')[0];
            };

            const calendarDays = useMemo(() => {
                const days = [];
                for (let i = -3; i <= 60; i++) {
                    const d = new Date(); d.setDate(d.getDate() + i);
                    const dateStr = new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().split('T')[0];
                    days.push({ 
                        dateStr, 
                        label: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit' }), 
                        weekday: new Date(dateStr + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).replace('.', '').slice(0,3), 
                        isToday: i === 0, 
                        isPast: i < 0 
                    });
                }
                return days;
            }, []);

            const getLogsValue = (dateStr) => {
                if (dateStr > getTodayDateStr()) return 0;
                const log = logs[dateStr];
                return log ? (Number(log.d1) || 0) + (Number(log.d2) || 0) + (Number(log.d3) || 0) : 0;
            };

            const statsCalculated = useMemo(() => {
                const allEntries = Object.values(logs);
                const totalSaidaGeral = allEntries.reduce((acc, curr) => acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0), 0);
                const todayStr = getTodayDateStr();
                const totalSaidaAteHoje = allEntries.reduce((acc, curr) => curr.data <= todayStr ? acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0) : acc, 0);
                const totalEntrada = replenishments.reduce((acc, curr) => acc + (curr.isScheduled ? 0 : (Number(curr.amount) || 0)), 0);
                return { previsao: estoqueInicialBase + totalEntrada - totalSaidaGeral, estoque: estoqueInicialBase + totalEntrada - totalSaidaAteHoje, totalEntrada };
            }, [logs, replenishments, estoqueInicialBase]);

            const chartDataCalculated = useMemo(() => {
                let data = []; let totalGeral = 0;
                const today = new Date(); today.setHours(0,0,0,0);
                const formatD = (d) => { const offset = d.getTimezoneOffset() * 60000; return new Date(d.getTime() - offset).toISOString().split('T')[0]; };

                if (chartType === 'weekly') {
                    let sumAnt = 0; for (let i = 13; i >= 7; i--) { let d = new Date(today); d.setDate(d.getDate() - i); sumAnt += getLogsValue(formatD(d)); }
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); 
                    for (let i = 6; i >= 0; i--) { let d = new Date(today); d.setDate(d.getDate() - i); let val = getLogsValue(formatD(d)); data.push({ name: d.toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0,3), Total: val }); totalGeral += val; }
                } else if (chartType === 'monthly') {
                    let sumAnt = 0; for(let i = 28; i < 56; i++) { let d = new Date(today); d.setDate(d.getDate() - i); sumAnt += getLogsValue(formatD(d)); }
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); 
                    for(let w = 3; w >= 0; w--) { let sumW = 0; for(let dIdx = 0; dIdx < 7; dIdx++) { let d = new Date(today); d.setDate(d.getDate() - ((w * 7) + dIdx)); sumW += getLogsValue(formatD(d)); } data.push({ name: `Sem ${4 - w}`, Total: sumW }); totalGeral += sumW; }
                } else if (chartType === 'yearly') {
                    let cYear = today.getFullYear(); let cMonth = today.getMonth(); let monthsData = [];
                    for(let i = 11; i >= 0; i--) { let d = new Date(cYear, cMonth - i, 1); let mStr = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}`; let sumM = 0; Object.keys(logs).forEach(date => { if (date.startsWith(mStr)) sumM += getLogsValue(date); }); monthsData.push({ name: d.toLocaleDateString('pt-BR', { month: 'short' }).slice(0,3), Total: sumM, sortKey: mStr }); totalGeral += sumM; }
                    let oldestM = monthsData[0].sortKey; let sumAnt = 0; Object.keys(logs).forEach(date => { if (date.slice(0, 7) < oldestM) sumAnt += getLogsValue(date); });
                    data.push({ name: '<', Total: sumAnt, isSpecial: true }); data = [...data, ...monthsData];
                }
                return { data, total: totalGeral };
            }, [logs, chartType]);

            const historyItemsCalculated = useMemo(() => {
                const todayStr = getTodayDateStr();
                const pastLogs = Object.values(logs).filter(l => l.data < todayStr && ((Number(l.d1)||0) + (Number(l.d2)||0) + (Number(l.d3)||0)) > 0);
                if (pastLogs.length === 0) return [];
                const oldestDateStr = pastLogs.reduce((oldest, curr) => curr.data < oldest.data ? curr : oldest).data;
                const items = []; let emptyStreak = []; let currDate = new Date(todayStr + 'T12:00:00'); currDate.setDate(currDate.getDate() - 1);
                const oldestDateObj = new Date(oldestDateStr + 'T12:00:00'); let logCount = 0;
                while (currDate >= oldestDateObj) {
                    const dStr = currDate.toISOString().split('T')[0]; const log = logs[dStr] || { d1: '', d2: '', d3: '', data: dStr }; const total = (Number(log.d1)||0) + (Number(log.d2)||0) + (Number(log.d3)||0);
                    if (total > 0) {
                        if (emptyStreak.length > 5) { items.push({ type: 'empty_group', startDate: emptyStreak[emptyStreak.length - 1].data, endDate: emptyStreak[0].data, count: emptyStreak.length }); } else if (emptyStreak.length > 0) { emptyStreak.forEach(emptyLog => items.push({ type: 'log', log: emptyLog, isEditable: logCount < 5 })); }
                        emptyStreak = []; items.push({ type: 'log', log, isEditable: logCount < 5 }); logCount++;
                    } else { emptyStreak.push(log); }
                    currDate.setDate(currDate.getDate() - 1);
                }
                if (emptyStreak.length > 5) { items.push({ type: 'empty_group', startDate: emptyStreak[emptyStreak.length - 1].data, endDate: emptyStreak[0].data, count: emptyStreak.length }); } else if (emptyStreak.length > 0) { emptyStreak.forEach(emptyLog => items.push({ type: 'log', log: emptyLog, isEditable: logCount < 5 })); }
                return items;
            }, [logs]);

            // --- FUNÇÕES DE INTERAÇÃO ---

            const showToast = (message, type = 'success') => {
                setToast({ message, type });
                if (toastTimeout.current) clearTimeout(toastTimeout.current);
                toastTimeout.current = setTimeout(() => setToast(null), 3000);
            };

            const isMobileDevice = () => /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);

            const calculateDaysAgo = (dateStr) => {
                if (!dateStr) return null;
                const today = new Date(getTodayDateStr() + 'T12:00:00');
                const pastDate = new Date(dateStr + 'T12:00:00');
                return Math.floor((today - pastDate) / (1000 * 60 * 60 * 24));
            };

            const updateCloud = (updates) => {
                if (!user || !db) return;
                db.collection('medicacao_users').doc(user.uid).update({ 
                    logs: updates.logs || logs, 
                    replenishments: updates.replenishments || replenishments 
                }).catch(() => setStatus('Erro Cloud'));
            };

            const handleBackup = () => {
                const data = JSON.stringify({ logs, replenishments });
                const blob = new Blob([data], { type: 'application/json' });
                const a = document.createElement('a'); a.href = URL.createObjectURL(blob); 
                a.download = `backup_farmacias_${getTodayDateStr()}.json`; a.click();
                showToast("Backup salvo!");
            };

            const handleRestore = (e) => {
                const file = e.target.files[0]; if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const data = JSON.parse(event.target.result);
                        if (data.logs) setLogs(data.logs); if (data.replenishments) setReplenishments(data.replenishments);
                        updateCloud(data); showToast("Restauração concluída!", "success");
                    } catch (err) { showToast("Erro no arquivo.", "error"); }
                };
                reader.readAsText(file); e.target.value = ''; 
            };

            const handleAuth = async (e) => {
                e.preventDefault(); setAuthError('');
                try {
                    if (isRegisterMode) await auth.createUserWithEmailAndPassword(emailInput, passwordInput);
                    else await auth.signInWithEmailAndPassword(emailInput, passwordInput);
                    showToast("Sucesso!", "success");
                } catch (err) { setAuthError('E-mail ou senha inválidos.'); }
            };

            const handleGoogleLogin = async () => {
                try {
                    const provider = new firebase.auth.GoogleAuthProvider();
                    await auth.signInWithPopup(provider);
                    showToast("Login Google realizado!", "success");
                } catch (err) { if (err.code !== 'auth/popup-closed-by-user') setAuthError('Erro no Login Google.'); }
            };

            const handleLogout = () => auth.signOut();

            const handleSupply = () => {
                if (!supplyData.amount) { showToast("Insira a quantidade.", "error"); return; }
                let updated;
                if (supplyData.id) {
                    updated = replenishments.map(r => r.id === supplyData.id ? { ...r, amount: Number(supplyData.amount), date: supplyData.date, isScheduled: supplyData.isScheduled } : r);
                } else {
                    updated = [...replenishments, { amount: Number(supplyData.amount), date: supplyData.date || getTodayDateStr(), isScheduled: supplyData.isScheduled, id: Date.now() }];
                }
                setReplenishments(updated); updateCloud({ replenishments: updated }); setShowSupplyModal(false);
                setSupplyData({ id: null, amount: '', date: '', isScheduled: false });
                showToast("Registro salvo!");
            };

            const confirmPurchase = (id) => {
                const updated = replenishments.map(r => r.id === id ? { ...r, isScheduled: false, date: getTodayDateStr() } : r);
                setReplenishments(updated); updateCloud({ replenishments: updated });
                showToast("Compra confirmada!", "success");
            };

            const deletePurchase = (id) => {
                const updated = replenishments.filter(r => r.id !== id);
                setReplenishments(updated); updateCloud({ replenishments: updated });
                showToast("Excluído.", "error");
            };

            const handleInputChange = (dateStr, field, value) => {
                const curr = logs[dateStr] || { d1: '', d2: '', d3: '', data: dateStr };
                const updatedLogs = {...logs, [dateStr]: { ...curr, [field]: value === '' ? '' : Number(value) }};
                setLogs(updatedLogs); updateCloud({ logs: updatedLogs });
            };

            const handleInsertRow = (targetDate) => {
                const idx = calendarDays.findIndex(d => d.dateStr === targetDate); if (idx === -1) return;
                const newLogs = { ...logs };
                for (let i = calendarDays.length - 1; i > idx; i--) {
                    const prev = calendarDays[i-1].dateStr; const curr = calendarDays[i].dateStr;
                    if (newLogs[prev]) newLogs[curr] = { ...newLogs[prev], data: curr };
                    else delete newLogs[curr];
                }
                delete newLogs[targetDate]; setLogs(newLogs); updateCloud({ logs: newLogs });
            };

            const handleDeleteRow = (targetDate) => {
                const idx = calendarDays.findIndex(d => d.dateStr === targetDate); if (idx === -1) return;
                const newLogs = { ...logs };
                for (let i = idx; i < calendarDays.length - 1; i++) {
                    const curr = calendarDays[i].dateStr; const next = calendarDays[i+1].dateStr;
                    if (newLogs[next]) newLogs[curr] = { ...newLogs[next], data: curr };
                    else delete newLogs[curr];
                }
                delete newLogs[calendarDays[calendarDays.length - 1].dateStr]; setLogs(newLogs); updateCloud({ logs: newLogs });
            };

            const handleClearRow = (dateStr) => {
                const updated = { ...logs }; delete updated[dateStr]; 
                setLogs(updated); updateCloud({ logs: updated });
            };

            const handleClearAll = () => {
                const today = getTodayDateStr(); const updated = {};
                Object.keys(logs).forEach(k => { if (k < today) updated[k] = logs[k]; });
                setLogs(updated); updateCloud({ logs: updated }); showToast("Grade limpa!");
            };

            const onInputFocus = () => {
                if (!isMobileDevice()) return;
                if (keyboardTimeoutRef.current) clearTimeout(keyboardTimeoutRef.current);
                setIsKeyboardVisible(true); setForceShowNav(false);
            };

            const onInputBlur = () => {
                if (!isMobileDevice()) return;
                if (keyboardTimeoutRef.current) clearTimeout(keyboardTimeoutRef.current);
                setIsKeyboardVisible(false); 
                setForceShowNav(false);
            };

            const handleKeyDown = (e, dayIdx, doseNum) => {
                const keys = ['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'];
                if (!keys.includes(e.key)) return;

                let nextDayIdx = dayIdx;
                let nextDoseNum = doseNum;

                if (e.key === 'ArrowRight') {
                    if (doseNum < 3) {
                        nextDoseNum++;
                    } else if (dayIdx < calendarDays.length - 1) {
                        nextDayIdx++;
                        nextDoseNum = 1;
                    }
                } else if (e.key === 'ArrowLeft') {
                    if (doseNum > 1) {
                        nextDoseNum--;
                    } else if (dayIdx > 0) {
                        nextDayIdx--;
                        nextDoseNum = 3;
                    }
                } else if (e.key === 'ArrowDown') {
                    if (dayIdx < calendarDays.length - 1) {
                        nextDayIdx++;
                    }
                } else if (e.key === 'ArrowUp') {
                    if (dayIdx > 0) {
                        nextDayIdx--;
                    }
                }

                if (nextDayIdx !== dayIdx || nextDoseNum !== doseNum) {
                    e.preventDefault();
                    const targetDate = calendarDays[nextDayIdx].dateStr;
                    const targetId = `dose-${targetDate}-${nextDoseNum}`;
                    const targetEl = document.getElementById(targetId);
                    if (targetEl) targetEl.focus();
                }
            };

            const handleInstallApp = async () => { 
                if (deferredPrompt) { 
                    deferredPrompt.prompt(); 
                    const { outcome } = await deferredPrompt.userChoice; 
                    if (outcome === 'accepted') {
                        setDeferredPrompt(null);
                        showToast("Instalação iniciada!");
                    }
                } else {
                    showToast("O instalador não está pronto. Utilize o menu do navegador.", "error");
                }
            };

            // --- EFFECTS ---

            useEffect(() => {
                const unsub = auth.onAuthStateChanged(u => { setUser(u); setAuthLoading(false); });
                return () => unsub();
            }, []);

            useEffect(() => {
                if (!user) return;
                localStorage.setItem('tramal_app_final_logs', JSON.stringify(logs));
                localStorage.setItem('tramal_app_final_supply', JSON.stringify(replenishments));
            }, [logs, replenishments, user]);

            useEffect(() => {
                if (!user || !db) return;
                const unsub = db.collection('medicacao_users').doc(user.uid).onSnapshot(doc => {
                    if (doc.exists) {
                        const data = doc.data();
                        if (data.logs) setLogs(data.logs);
                        if (data.replenishments) setReplenishments(data.replenishments);
                    } else {
                        db.collection('medicacao_users').doc(user.uid).set({ logs, replenishments });
                    }
                }, (error) => console.log("Firebase Error:", error));
                return () => unsub();
            }, [user]);

            useEffect(() => {
                if (activeTab === 'agenda' && todayRowRef.current) {
                    setTimeout(() => {
                        todayRowRef.current.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }, 100);
                }
            }, [activeTab]);

            useEffect(() => {
                const handleBeforeInstallPrompt = (e) => { 
                    e.preventDefault(); 
                    setDeferredPrompt(e); 
                };
                window.addEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
                return () => window.removeEventListener('beforeinstallprompt', handleBeforeInstallPrompt);
            }, []);

            // --- RENDER ---

            if (authLoading) return <div className="min-h-screen bg-slate-50 flex items-center justify-center"><div className="w-8 h-8 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div></div>;

            if (!user) {
                return (
                    <div className="min-h-screen bg-slate-50 flex flex-col items-center justify-center p-6 animate-fade relative text-center">
                        <ToastComponent toast={toast} />
                        <div className="w-full max-w-xs space-y-8 bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                            <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" className="w-20 h-20 mx-auto mb-4 opacity-90" alt="Logo" />
                            <div>
                                <h1 className="text-2xl font-bold tracking-tight text-slate-800 mb-1">Controle de Farmácias</h1>
                                <p className="text-[10px] font-semibold text-indigo-500 uppercase tracking-widest">{isRegisterMode ? 'Nova Conta' : 'Acesso Restrito'}</p>
                            </div>
                            <form onSubmit={handleAuth} className="space-y-4 text-left">
                                <input type="email" required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-center text-sm font-medium text-slate-800 outline-none focus:border-indigo-400 placeholder:text-slate-400 transition-colors" value={emailInput} onChange={(e) => setEmailInput(e.target.value)} placeholder="Seu e-mail" />
                                <input type="password" required className="w-full bg-slate-50 border border-slate-200 rounded-xl p-4 text-center text-lg font-bold text-slate-800 tracking-widest outline-none focus:border-indigo-400 placeholder:text-slate-400 transition-colors" value={passwordInput} onChange={(e) => setPasswordInput(e.target.value)} placeholder="Senha" />
                                {authError && <p className="text-rose-500 text-[10px] font-bold uppercase tracking-widest text-center">{authError}</p>}
                                <button type="submit" className="w-full py-4 bg-indigo-600 text-white text-xs font-bold rounded-xl uppercase tracking-widest shadow-md hover:bg-indigo-700 active:scale-[0.98] transition-all">{isRegisterMode ? 'Registrar' : 'Entrar'}</button>
                            </form>
                            <div className="relative flex items-center py-2"><div className="flex-grow border-t border-slate-100"></div><span className="flex-shrink-0 mx-4 text-slate-400 text-[9px] font-bold uppercase tracking-widest">ou</span><div className="flex-grow border-t border-slate-100"></div></div>
                            <button onClick={handleGoogleLogin} className="w-full py-3.5 bg-white border border-slate-200 text-slate-700 text-xs font-bold rounded-xl uppercase tracking-widest hover:bg-slate-50 active:scale-[0.98] transition-all flex items-center justify-center"><span className="mr-3"><IconGoogle /></span> Google</button>
                            <button onClick={() => setIsRegisterMode(!isRegisterMode)} className="text-[10px] font-bold text-slate-500 hover:text-indigo-600 transition-colors uppercase tracking-widest mt-4 block mx-auto">{isRegisterMode ? 'Já tenho conta' : 'Criar uma conta'}</button>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col bg-slate-50">
                    <ToastComponent toast={toast} />
                    <header className="bg-slate-900 text-white pt-5 pb-6 px-5 rounded-b-[2rem] shadow-md sticky top-0 z-40">
                        <div className="max-w-md mx-auto flex justify-between items-center gap-3">
                            <div className="flex items-center">
                                <img src="https://cdn-icons-png.flaticon.com/512/2966/2966327.png" className="w-7 h-7 mr-3 opacity-90" alt="Logo" />
                                <div>
                                    <h1 className="text-lg font-bold tracking-tight leading-none">Controle de Farmácias</h1>
                                    <div className="flex items-center space-x-1 mt-1">
                                        <span className="text-indigo-400"><IconCloud /></span>
                                        <p className="text-[9px] font-semibold uppercase text-slate-400 tracking-wider">{status}</p>
                                        <button onClick={handleLogout} className="ml-2 p-1 text-slate-400 hover:text-rose-400 transition-colors" title="Sair"><IconLogout /></button>
                                    </div>
                                </div>
                            </div>
                            <div className={`p-3 px-4 rounded-xl border ${statsCalculated.previsao < 0 ? 'bg-rose-500/10 border-rose-500/30 text-rose-400' : 'bg-slate-800 border-slate-700 text-indigo-300'}`}>
                                <span className="block text-[8px] font-bold uppercase opacity-80 text-center tracking-widest">Previsão</span>
                                <span className="text-xl font-bold leading-none">{statsCalculated.previsao}</span>
                            </div>
                        </div>
                    </header>

                    <main className="max-w-md mx-auto px-4 -mt-3 relative z-10 flex-1 w-full pb-32">
                        {activeTab === 'dashboard' && (
                            <div className="space-y-4 pt-2 animate-fade">
                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 text-center">
                                    <p className="text-slate-400 text-[10px] font-bold uppercase tracking-widest mb-2">Estoque Real</p>
                                    <p className={`text-5xl font-bold mb-5 ${statsCalculated.estoque < 0 ? 'text-rose-500' : 'text-slate-800'}`}>{statsCalculated.estoque}</p>
                                    <button onClick={() => { setSupplyData({ id: null, amount: '', date: getTodayDateStr(), isScheduled: false }); setShowSupplyModal(true); }} className="bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl text-[11px] font-bold flex items-center justify-center shadow-md w-full mb-3 active:scale-[0.98] transition-all"><span className="mr-2 opacity-80"><IconPlus /></span> REGISTRAR COMPRA</button>
                                    
                                    <button onClick={handleInstallApp} className="w-full py-3 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-xl text-[10px] font-bold uppercase tracking-widest flex items-center justify-center active:scale-[0.98] transition-all">
                                        <span className="mr-2"><IconDevice /></span> Instalar App
                                    </button>
                                </div>

                                <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100">
                                    <div className="flex justify-between items-center mb-6">
                                        <h3 className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Gráfico de Uso</h3>
                                        <div className="flex bg-slate-50 rounded-lg p-1 border border-slate-100">
                                            <button onClick={() => setChartType('weekly')} className={`px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition-all ${chartType === 'weekly' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>Semanal</button>
                                            <button onClick={() => setChartType('monthly')} className={`px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition-all ${chartType === 'monthly' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>Mensal</button>
                                            <button onClick={() => setChartType('yearly')} className={`px-3 py-1.5 text-[9px] font-bold uppercase rounded-md transition-all ${chartType === 'yearly' ? 'bg-white shadow-sm text-indigo-600' : 'text-slate-400'}`}>Anual</button>
                                        </div>
                                    </div>
                                    <div className="bg-slate-50 text-slate-700 py-3 rounded-xl text-center mb-5 border border-slate-100">
                                        <span className="text-xl font-bold">{chartDataCalculated.total} cápsulas</span>
                                    </div>
                                    <div className="h-48 w-full"><ManualBarChart data={chartDataCalculated.data} /></div>
                                </div>
                                
                                <div className="flex space-x-3 mt-4">
                                    <button onClick={handleBackup} className="flex-1 py-4 bg-white border border-slate-200 text-slate-600 rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center shadow-sm hover:bg-slate-50 transition-colors"><span className="mr-2 text-indigo-500"><IconDownload /></span> Backup</button>
                                    <button onClick={() => fileInputRef.current.click()} className="flex-1 py-4 bg-white border border-slate-200 text-slate-600 rounded-2xl text-[10px] font-bold uppercase flex items-center justify-center shadow-sm hover:bg-slate-50 transition-colors"><span className="mr-2 text-indigo-500"><IconUpload /></span> Restaurar</button>
                                </div>
                                <input type="file" ref={fileInputRef} className="hidden" accept=".json" onChange={handleRestore} />
                            </div>
                        )}

                        {activeTab === 'agenda' && (
                            <div className="bg-white rounded-3xl shadow-sm border border-slate-100 overflow-hidden mt-4 animate-fade">
                                <div className="p-5 bg-slate-50 border-b border-slate-100 flex justify-between items-center"><h2 className="text-[11px] font-bold uppercase tracking-widest text-slate-700">Grade de Lançamento</h2><button onClick={handleClearAll} className="text-[9px] font-bold uppercase text-rose-500 hover:text-rose-600">Limpar Tudo</button></div>
                                <div className="space-y-2 max-h-[62vh] overflow-y-auto px-3 pt-4 pb-10 scrollbar-hide">
                                    {calendarDays.map((day, dIdx) => {
                                        const log = logs[day.dateStr] || { d1: '', d2: '', d3: '' };
                                        const total = (Number(log.d1)||0) + (Number(log.d2)||0) + (Number(log.d3)||0);
                                        const totalSaidaAteData = Object.values(logs).reduce((acc, curr) => curr.data <= day.dateStr ? acc + (Number(curr.d1) || 0) + (Number(curr.d2) || 0) + (Number(curr.d3) || 0) : acc, 0);
                                        const runningStock = estoqueInicialBase + statsCalculated.totalEntrada - totalSaidaAteData;

                                        const rowClass = day.isPast ? 'bg-slate-50/50 border-slate-100' : day.isToday ? 'bg-indigo-50/30 border-indigo-100 shadow-sm' : 'bg-white border-slate-100';
                                        const dateBoxClass = day.isPast ? 'bg-slate-200 text-slate-500' : day.isToday ? 'bg-indigo-600 text-white' : 'bg-slate-100 text-slate-600';
                                        let badgeClass = total > 0 ? (day.isPast ? 'bg-slate-300 text-slate-700' : 'bg-slate-800 text-white') : 'bg-slate-100 text-slate-400';
                                        if (runningStock <= 0 && !day.isPast) {
                                            badgeClass = 'bg-rose-500 text-white shadow-sm animate-pulse';
                                        }

                                        return (
                                            <div key={day.dateStr} ref={day.isToday ? todayRowRef : null} className={`flex items-center gap-2 p-2 rounded-2xl border ${rowClass}`}>
                                                <div className="flex flex-col gap-1 w-6 shrink-0">
                                                    <button onClick={() => handleInsertRow(day.dateStr)} className="text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-md p-1 transition-colors" title="Inserir linha"><IconInsertRow /></button>
                                                    <button onClick={() => handleDeleteRow(day.dateStr)} className="text-slate-400 hover:text-rose-500 hover:bg-rose-50 rounded-md p-1 transition-colors" title="Excluir linha"><IconDeleteRow /></button>
                                                </div>
                                                <div className={`h-12 w-11 rounded-xl flex flex-col items-center justify-center shrink-0 font-bold ${dateBoxClass}`}><span className="text-[9px] uppercase leading-none mb-0.5">{day.weekday}</span><span className="text-[15px] leading-none">{day.label.split('/')[0]}</span></div>
                                                <div className="flex-1 flex justify-center gap-1.5">
                                                    {[1,2,3].map(num => (
                                                        <input 
                                                            key={num} 
                                                            id={`dose-${day.dateStr}-${num}`}
                                                            type="number" 
                                                            placeholder="-" 
                                                            className="w-full max-w-[42px] h-10 text-center rounded-lg font-semibold border border-slate-200 bg-white focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 outline-none transition-all" 
                                                            value={log[`d${num}`]} 
                                                            onFocus={onInputFocus} 
                                                            onBlur={onInputBlur} 
                                                            onKeyDown={(e) => handleKeyDown(e, dIdx, num)}
                                                            onChange={e=>handleInputChange(day.dateStr, `d${num}`, e.target.value)} 
                                                        />
                                                    ))}
                                                </div>
                                                <div className="w-8 flex justify-center shrink-0 relative">
                                                    <span className={`flex items-center justify-center h-8 w-8 text-[13px] font-bold rounded-lg transition-all duration-300 ${badgeClass}`}>{total || '-'}</span>
                                                </div>
                                                <div className="w-6"><button onClick={() => handleClearRow(day.dateStr)} className="text-slate-300 hover:text-rose-400 p-1" title="Limpar dia"><IconX /></button></div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}

                        {activeTab === 'history' && (
                            <div className="space-y-4 pt-4 animate-fade">
                                <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest ml-2">Histórico de Registros</h2>
                                <div className="space-y-3 pb-10">
                                    {historyItemsCalculated.map((item) => item.type === 'empty_group' ? (
                                        <div key={item.startDate} className="p-4 rounded-2xl border border-slate-100 bg-slate-50/50 text-slate-400 text-[10px] font-bold uppercase text-center my-2">Vazio: {item.count} dias</div>
                                    ) : (
                                        <div key={item.log.data} className="flex items-center gap-3 p-3 rounded-2xl border border-slate-100 bg-white shadow-sm">
                                            <button onClick={() => handleClearRow(item.log.data)} className="bg-slate-50 text-slate-400 hover:text-rose-500 rounded-lg p-2 transition-colors"><IconMinus /></button>
                                            <div className="h-12 w-11 rounded-xl flex flex-col items-center justify-center bg-slate-100 text-slate-600"><span className="text-[9px] uppercase font-bold">{new Date(item.log.data + 'T12:00:00').toLocaleDateString('pt-BR', { weekday: 'short' }).slice(0,3)}</span><span className="text-[15px] font-bold">{item.log.data.split('-')[2]}</span></div>
                                            <div className="flex-1 flex justify-center gap-2">{[1,2,3].map(num => (<input key={num} type="number" placeholder="-" disabled={!item.isEditable} className={`w-full max-w-[42px] h-10 text-center rounded-lg font-semibold border ${item.isEditable ? 'bg-white border-slate-200 focus:border-indigo-400' : 'bg-slate-50 border-slate-100 text-slate-400'}`} value={item.log[`d${num}`]} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>handleInputChange(item.log.data, `d${num}`, e.target.value)} />))}</div>
                                            <div className="w-8 flex justify-center"><span className="flex items-center justify-center h-8 w-8 text-[13px] font-bold rounded-lg bg-slate-200 text-slate-600">{(Number(item.log.d1)||0)+(Number(item.log.d2)||0)+(Number(item.log.d3)||0)}</span></div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {activeTab === 'purchases' && (
                            <div className="space-y-4 pt-4 animate-fade">
                                <div className="flex justify-between items-center px-2 mb-2">
                                    <h2 className="text-[11px] font-bold text-slate-500 uppercase tracking-widest mt-1">Compras e Agendamentos</h2>
                                    <button onClick={() => { setSupplyData({ id: null, amount: '', date: getTodayDateStr(), isScheduled: false }); setShowSupplyModal(true); }} className="bg-indigo-50 text-indigo-600 px-4 py-2 rounded-lg text-[10px] font-bold flex items-center hover:bg-indigo-100 transition-colors"><IconPlus /><span className="ml-1.5 uppercase">Registrar</span></button>
                                </div>
                                <div className="space-y-3 pb-10">
                                    {[...replenishments].sort((a,b) => new Date(b.date) - new Date(a.date) || b.id - a.id).map(compra => {
                                        const days = calculateDaysAgo(compra.date);
                                        return (
                                        <div key={compra.id} className={`p-4 rounded-2xl shadow-sm border flex items-center justify-between ${compra.isScheduled ? 'bg-amber-50/30 border-amber-100' : 'bg-white border-slate-100'}`}>
                                            <div className="flex items-center flex-1 min-w-0">
                                                <button onClick={() => deletePurchase(compra.id)} className="h-8 w-8 bg-slate-50 text-slate-400 hover:bg-rose-50 hover:text-rose-500 rounded-lg flex items-center justify-center mr-3 transition-colors"><IconMinus /></button>
                                                <div className={`h-12 w-12 rounded-xl flex flex-col items-center justify-center mr-4 font-bold ${compra.isScheduled ? 'bg-amber-100 text-amber-700' : 'bg-slate-100 text-slate-600'}`}><span className="text-[10px] uppercase opacity-80 leading-none mb-0.5">{new Date(compra.date + 'T12:00:00').toLocaleDateString('pt-BR', { month: 'short' })}</span><span className="text-lg leading-none">{compra.date.split('-')[2]}</span></div>
                                                <div className="flex-1 min-w-0 pr-2">
                                                    <p className={`text-lg font-bold leading-none mb-1.5 ${compra.isScheduled ? 'text-amber-600' : 'text-slate-800'}`}>{compra.amount} <span className="text-[10px] opacity-70 uppercase font-semibold">Cáps</span></p>
                                                    <div className="mt-1"><span className={`text-[9px] font-bold uppercase tracking-widest px-2 py-1 rounded-md ${compra.isScheduled ? 'bg-amber-200/50 text-amber-800' : (days === 0 ? 'bg-indigo-100/50 text-indigo-700' : 'bg-slate-100 text-slate-500')}`}>{compra.isScheduled ? 'Agendado' : (days === 0 ? 'Hoje' : `Há ${days} dias`)}</span></div>
                                                </div>
                                            </div>
                                            <div className="flex flex-col gap-2">
                                                {compra.isScheduled && <button onClick={() => confirmPurchase(compra.id)} className="px-4 py-2 bg-indigo-600 text-white rounded-lg text-[10px] font-bold uppercase shadow-sm hover:bg-indigo-700">Confirma</button>}
                                                <button onClick={() => { setSupplyData({ id: compra.id, amount: compra.amount, date: compra.date, isScheduled: compra.isScheduled }); setShowSupplyModal(true); }} className="px-4 py-2 bg-slate-100 text-slate-600 rounded-lg text-[10px] font-bold uppercase hover:bg-slate-200">Editar</button>
                                            </div>
                                        </div>
                                    )})}
                                </div>
                            </div>
                        )}
                    </main>

                    {showSupplyModal && (
                        <div className="fixed inset-0 z-[100] flex items-end sm:items-center justify-center p-0 bg-slate-900/40 backdrop-blur-sm animate-fade">
                            <div className="bg-white w-full max-w-sm rounded-t-[2rem] sm:rounded-3xl p-8 shadow-2xl animate-slide-up">
                                <h2 className="text-lg font-bold text-center mb-6 uppercase text-slate-800 tracking-wide">{supplyData.id ? (supplyData.isScheduled ? 'Ajustar Agenda' : 'Editar Compra') : (supplyData.isScheduled ? 'Novo Agendamento' : 'Novo Registro')}</h2>
                                <div className="space-y-4 mb-8">
                                    <div className={`${supplyData.isScheduled ? 'bg-amber-50 border-amber-100' : 'bg-slate-50 border-slate-100'} p-5 rounded-2xl border`}><label className={`text-[10px] font-bold uppercase mb-2 block ${supplyData.isScheduled ? 'text-amber-600' : 'text-slate-500'}`}>Quantidade</label><input type="number" placeholder="0" className={`w-full text-4xl font-bold text-center bg-transparent border-none outline-none ${supplyData.isScheduled ? 'text-amber-600' : 'text-slate-800'}`} value={supplyData.amount} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, amount: e.target.value})} /></div>
                                    <input type="date" className={`w-full font-semibold bg-white border border-slate-200 rounded-xl p-4 text-slate-700 outline-none focus:border-indigo-400 focus:ring-1 focus:ring-indigo-400 transition-all`} value={supplyData.date} onFocus={onInputFocus} onBlur={onInputBlur} onChange={e=>setSupplyData({...supplyData, date: e.target.value})} />
                                    <button type="button" onClick={() => setSupplyData({...supplyData, isScheduled: !supplyData.isScheduled})} className={`w-full py-4 rounded-xl text-[11px] font-bold uppercase tracking-widest flex items-center justify-center border transition-all active:scale-[0.98] ${supplyData.isScheduled ? 'bg-amber-100 text-amber-800 border-amber-200' : 'bg-slate-50 text-slate-600 border-slate-200 hover:bg-slate-100'}`}>
                                        <span className="mr-2"><IconClock /></span>{supplyData.isScheduled ? 'Compra agendada' : 'Agendar esta compra'}
                                    </button>
                                </div>
                                <div className="flex space-x-3"><button onClick={()=>setShowSupplyModal(false)} className="flex-1 py-4 text-[11px] font-bold text-slate-500 bg-slate-100 hover:bg-slate-200 rounded-xl uppercase transition-colors">Voltar</button><button onClick={handleSupply} className={`flex-[2] py-4 text-white text-[11px] font-bold rounded-xl uppercase shadow-sm active:scale-[0.98] transition-all ${supplyData.isScheduled ? 'bg-amber-500 hover:bg-amber-600' : 'bg-indigo-600 hover:bg-indigo-700'}`}>Salvar</button></div>
                            </div>
                        </div>
                    )}

                    <nav className={`fixed bottom-0 left-0 right-0 bg-white border-t border-slate-100 flex justify-between items-center py-2 px-6 pb-8 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)] z-40 transition-transform duration-500 ${(isKeyboardVisible && !forceShowNav) ? 'translate-y-full opacity-0 pointer-events-none' : 'translate-y-0 opacity-100'}`}>
                        <button onClick={()=>setActiveTab('dashboard')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'dashboard' ? 'text-indigo-600 scale-105 font-bold' : 'text-slate-400 hover:text-slate-600'}`}><IconHome /><span className="text-[10px] mt-1.5 uppercase tracking-wide">Início</span></button>
                        <button onClick={()=>setActiveTab('agenda')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'agenda' ? 'text-indigo-600 scale-105 font-bold' : 'text-slate-400 hover:text-slate-600'}`}><IconTable /><span className="text-[10px] mt-1.5 uppercase tracking-wide">Lançar</span></button>
                        <button onClick={()=>setActiveTab('history')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'history' ? 'text-indigo-600 scale-105 font-bold' : 'text-slate-400 hover:text-slate-600'}`}><IconHistory /><span className="text-[10px] mt-1.5 uppercase tracking-wide">Registros</span></button>
                        <button onClick={()=>setActiveTab('purchases')} className={`flex flex-col items-center p-2 rounded-xl transition-all ${activeTab === 'purchases' ? 'text-indigo-600 scale-105 font-bold' : 'text-slate-400 hover:text-slate-600'}`}><IconBag /><span className="text-[10px] mt-1.5 uppercase tracking-wide">Compras</span></button>
                    </nav>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
